<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metadata Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F8}
a{color:#0F766E}a:hover{color:#115E59}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.inp{box-sizing:border-box;width:100%;min-height:44px;padding:10px 12px;border:1px solid #C5CED8;border-radius:8px;background:#fff;color:#15202B;font:inherit;font-size:14px}
.inp:focus{outline:2px solid #0F766E;outline-offset:1px;border-color:#0F766E}
textarea.inp{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;line-height:1.55;resize:vertical}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:#3B4856;min-width:0}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #0F766E;background:#0F766E;color:#fff;font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:#115E59}
.btn2{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid #C5CED8;background:#fff;color:#15202B;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.btn2:hover{border-color:#0F766E;color:#0F766E}
.del{min-height:36px;padding:0 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:#B42318;font:inherit;font-size:13px;cursor:pointer}
.del:hover{border-color:#F3C1BC;background:#FEF3F2}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:0;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;text-align:left}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#4A5765;padding:10px 12px;border-bottom:1px solid #D9E0E7;background:#F8FAFB}
.tbl td{padding:10px 12px;border-bottom:1px solid #E6EBF0;vertical-align:top}
.card{background:#fff;border:1px solid #DCE3EA;border-radius:12px}
@media (min-width: 900px){.side{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="dc-template">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #15202B; background: #F4F6F8">

<nav class="side" aria-label="Main navigation" style="flex: 1 1 240px; box-sizing: border-box; background: #15202B; color: #E8EDF2; padding: 24px 16px; display: flex; flex-direction: column; gap: 6px">
<div style="padding: 0 12px 20px; display: flex; flex-direction: column; gap: 4px">
<span class="mono" style="font-size: 12px; letter-spacing: 0.08em; color: #8FD3C9">DATA MANAGEMENT</span>
<span style="font-size: 22px; font-weight: 600">Metadata Hub</span>
</div>
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" class="nav" style="background: {{t.bg}}; color: {{t.fg}}" onClick="{{t.go}}"><span>{{t.label}}</span><span class="mono" style="font-size: 12px; opacity: 0.8">{{t.count}}</span></button>
</sc-for>
<sc-if value="{{hasEditor}}" hint-placeholder-val="{{false}}"><a href="editor.html" class="nav" style="color: #C9D3DD; text-decoration: none; border: 1px solid #2C3A48"><span>Diagram Editor</span><span aria-hidden="true">↗</span></a></sc-if>
<div style="margin-top: 20px; padding: 12px; border-top: 1px solid #2C3A48; font-size: 12px; line-height: 1.5; color: #AAB6C2">No database. YAML is the only source of truth: import to load, export to keep your changes. Nothing is saved when you close the page.</div>
<div style="padding: 0 12px; font-size: 12px; color: #AAB6C2; line-height: 1.5">{{sourceText}}</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600">{{pageTitle}}</h1>
<p style="margin: 0; font-size: 15px; color: #4A5765; max-width: 780px">{{pageDesc}}</p>
</header>

<sc-if value="{{hasMsg}}" hint-placeholder-val="{{false}}">
<div role="status" style="padding: 12px 16px; border-radius: 8px; font-size: 14px; white-space: pre-line; background: {{msgBg}}; color: {{msgFg}}; border: 1px solid {{msgBd}}">{{msg}}</div>
</sc-if>

<sc-if value="{{showEmpty}}" hint-placeholder-val="{{false}}">
<div class="card" style="padding: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
<p style="margin: 0; font-size: 14px; color: #3B4856">Nothing loaded yet. Import a YAML file or a .zip containing main.yaml.</p>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" class="btn" onClick="{{goImport}}">Go to Import</button><button type="button" class="btn2" onClick="{{loadSample}}">Load Airflow + GCP example</button></div>
</div>
</sc-if>

<!-- ================= CATALOG ================= -->
<sc-if value="{{isCatalog}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
<label class="lbl" style="flex: 1 1 320px">Search assets
<input class="inp" type="search" placeholder="id, name, type, owner, tag, property…" value="{{q}}" onChange="{{onQ}}">
</label>
<label class="lbl" style="flex: 0 1 280px">Asset type
<select class="inp" value="{{tf}}" onChange="{{onTf}}"><option value="">All types</option><sc-for list="{{tfOptions}}" as="o" hint-placeholder-count="3"><option value="{{o.id}}">{{o.label}}</option></sc-for></select>
</label>
<span style="font-size: 14px; color: #4A5765; padding-bottom: 12px">{{catalogCount}}</span>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
<article class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span class="mono" style="font-size: 12px; color: #0F766E; word-break: break-all">{{c.id}}</span>
<h2 style="margin: 0; font-size: 18px; font-weight: 600">{{c.name}}</h2>
</div>
<span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; border: 1px solid {{c.tcolor}}; color: {{c.tcolor}}; background: #FFFFFF; white-space: nowrap">{{c.typeLabel}}</span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3B4856">{{c.description}}</p>
<dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px">
<dt style="color: #5B6876">Parent</dt><dd class="mono" style="margin: 0; font-size: 12px; word-break: break-all">{{c.parent}}</dd>
<dt style="color: #5B6876">Domain</dt><dd style="margin: 0">{{c.domain}}</dd>
<dt style="color: #5B6876">Owner</dt><dd style="margin: 0">{{c.owner}}</dd>
<dt style="color: #5B6876">Source</dt><dd class="mono" style="margin: 0; font-size: 12px; word-break: break-all">{{c.source}}</dd>
<dt style="color: #5B6876">Schema</dt><dd style="margin: 0">{{c.fieldCount}} · {{c.linkCount}}</dd>
<dt style="color: #5B6876">File</dt><dd class="mono" style="margin: 0; font-size: 12px; word-break: break-all">{{c.file}}</dd>
<sc-for list="{{c.props}}" as="pp" hint-placeholder-count="2"><dt class="mono" style="color: #5B6876; font-size: 12px">{{pp.k}}</dt><dd class="mono" style="margin: 0; font-size: 12px; word-break: break-all">{{pp.v}}</dd></sc-for>
</dl>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{c.tagList}}" as="tg" hint-placeholder-count="2">
<span class="mono" style="font-size: 12px; padding: 3px 8px; border-radius: 6px; background: #EEF1F4; color: #3B4856">#{{tg.t}}</span>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 4px">
<button type="button" class="btn2" onClick="{{c.toDict}}">Dictionary</button>
<button type="button" class="btn2" onClick="{{c.toLin}}">Lineage</button>
<button type="button" class="del" onClick="{{c.del}}" aria-label="Delete asset {{c.id}}">Delete</button>
</div>
</article>
</sc-for>
</div>

<sc-if value="{{noCards}}" hint-placeholder-val="{{false}}">
<div class="card" style="padding: 24px; font-size: 14px; color: #4A5765">No matching assets.</div>
</sc-if>

<section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 16px" aria-labelledby="add-ds">
<h2 id="add-ds" style="margin: 0; font-size: 17px; font-weight: 600">Add asset</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<label class="lbl">Asset type
<select class="inp" value="{{dsForm.type}}" onChange="{{dsF.type}}"><sc-for list="{{typeOptions}}" as="o" hint-placeholder-count="5"><option value="{{o.id}}">{{o.label}}</option></sc-for></select>
</label>
<label class="lbl">ID (unique)<input class="inp mono" placeholder="my-project.mart.sales_daily" value="{{dsForm.id}}" onChange="{{dsF.id}}"></label>
<label class="lbl">Parent (optional)<input class="inp mono" list="asset-ids" placeholder="airflow.sales_daily.tg_transform" value="{{dsForm.parent}}" onChange="{{dsF.parent}}"></label>
<datalist id="asset-ids"><sc-for list="{{assetIds}}" as="a" hint-placeholder-count="3"><option value="{{a.id}}"></option></sc-for></datalist>
<label class="lbl">Name<input class="inp" placeholder="Daily sales" value="{{dsForm.name}}" onChange="{{dsF.name}}"></label>
<label class="lbl">Domain<input class="inp" placeholder="Sales" value="{{dsForm.domain}}" onChange="{{dsF.domain}}"></label>
<label class="lbl">Owner<input class="inp" placeholder="team / email" value="{{dsForm.owner}}" onChange="{{dsF.owner}}"></label>
<label class="lbl">Source / location<input class="inp mono" placeholder="bq://project.dataset.table" value="{{dsForm.source}}" onChange="{{dsF.source}}"></label>
<label class="lbl">Tags (comma separated)<input class="inp" placeholder="finance, daily" value="{{dsForm.tags}}" onChange="{{dsF.tags}}"></label>
</div>
<label class="lbl">Description<textarea class="inp" rows="2" style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px" value="{{dsForm.description}}" onChange="{{dsF.description}}"></textarea></label>
<label class="lbl">Properties (free-form YAML, optional)<textarea class="inp" rows="3" placeholder="operator: BigQueryInsertJobOperator&#10;retries: 2&#10;schedule: &quot;0 1 * * *&quot;" value="{{dsForm.properties}}" onChange="{{dsF.properties}}"></textarea></label>
<div><button type="button" class="btn" onClick="{{addDataset}}">Save asset</button></div>
</section>
</div>
</sc-if>

<!-- ================= DICTIONARY ================= -->
<sc-if value="{{isDict}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 20px">
<sc-if value="{{hasDatasets}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
<label class="lbl" style="flex: 1 1 280px">Asset
<select class="inp mono" value="{{sel}}" onChange="{{onSel}}">
<sc-for list="{{dsOptions}}" as="o" hint-placeholder-count="3"><option value="{{o.id}}">{{o.label}}</option></sc-for>
</select>
</label>
<label class="lbl" style="flex: 1 1 240px">Filter columns
<input class="inp" type="search" placeholder="name, type, description, expression…" value="{{fq}}" onChange="{{onFq}}">
</label>
</div>

<section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 6px">
<span class="mono" style="font-size: 12px; color: #0F766E">{{cur.id}}</span>
<h2 style="margin: 0; font-size: 20px; font-weight: 600">{{cur.name}}</h2>
<p style="margin: 0; font-size: 14px; color: #3B4856; line-height: 1.5">{{cur.description}}</p>
<p style="margin: 0; font-size: 13px; color: #5B6876">{{cur.meta}}</p>
</section>

<div class="card" style="overflow-x: auto">
<table class="tbl" style="min-width: 980px">
<thead><tr><th scope="col">Column</th><th scope="col">Type</th><th scope="col">Class</th><th scope="col">Nullable</th><th scope="col">PII</th><th scope="col">Description</th><th scope="col">Expression &amp; sources</th><th scope="col"><span style="position: absolute; left: -9999px">Actions</span></th></tr></thead>
<tbody>
<sc-for list="{{fieldRows}}" as="f" hint-placeholder-count="4">
<tr>
<td class="mono" style="font-weight: 500">{{f.name}}</td>
<td class="mono" style="color: #0F766E">{{f.type}}</td>
<td><span style="font-size: 12px; padding: 3px 8px; border-radius: 999px; background: {{f.clsBg}}; color: {{f.clsFg}}; white-space: nowrap">{{f.cls}}</span></td>
<td>{{f.nullText}}</td>
<td><span style="font-size: 12px; padding: 3px 8px; border-radius: 999px; background: {{f.piiBg}}; color: {{f.piiFg}}">{{f.piiText}}</span></td>
<td style="color: #3B4856">{{f.description}}<sc-if value="{{f.hasInh}}" hint-placeholder-val="{{false}}"><span class="mono" style="display: block; font-size: 11px; color: #6B21A8; margin-top: 2px">{{f.inhNote}}</span></sc-if></td>
<td style="max-width: 320px">
<sc-if value="{{f.hasExpr}}" hint-placeholder-val="{{false}}"><code class="mono" style="display: block; font-size: 12px; color: #0F766E; white-space: pre-wrap; word-break: break-word; margin-bottom: 4px">{{f.expr}}</code></sc-if>
<span class="mono" style="font-size: 11px; color: #5B6876; word-break: break-all">{{f.srcText}}</span>
</td>
<td style="text-align: right; white-space: nowrap"><button type="button" class="btn2" style="min-height: 36px" onClick="{{f.trace}}" aria-label="Trace lineage of column {{f.name}}">Trace</button> <button type="button" class="del" onClick="{{f.del}}" aria-label="Delete column {{f.name}}">Delete</button></td>
</tr>
</sc-for>
</tbody>
</table>
<sc-if value="{{noFields}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 16px; font-size: 14px; color: #4A5765">No matching columns.</p>
</sc-if>
</div>

<section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 16px" aria-labelledby="add-f">
<h2 id="add-f" style="margin: 0; font-size: 17px; font-weight: 600">Add column to {{cur.id}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; align-items: end">
<label class="lbl">Column name<input class="inp mono" placeholder="order_id" value="{{fieldForm.name}}" onChange="{{ffName}}"></label>
<label class="lbl">Data type<input class="inp mono" list="col-types" placeholder="STRING" value="{{fieldForm.type}}" onChange="{{ffType}}"></label>
<datalist id="col-types"><sc-for list="{{types}}" as="ty" hint-placeholder-count="5"><option value="{{ty.v}}"></option></sc-for></datalist>
<label style="display: flex; gap: 8px; align-items: center; min-height: 44px; font-size: 14px"><input type="checkbox" style="width: 20px; height: 20px" checked="{{fieldForm.nullable}}" onChange="{{ffNull}}"> Nullable</label>
<label style="display: flex; gap: 8px; align-items: center; min-height: 44px; font-size: 14px"><input type="checkbox" style="width: 20px; height: 20px" checked="{{fieldForm.pii}}" onChange="{{ffPii}}"> Personal data (PII)</label>
</div>
<label class="lbl">Description<input class="inp" placeholder="Business meaning of this column" value="{{fieldForm.description}}" onChange="{{ffDesc}}"></label>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px">
<label class="lbl">Expression / transformation (optional)<input class="inp mono" placeholder="SUM(net_amount)" value="{{fieldForm.expression}}" onChange="{{ffExpr}}"></label>
<label class="lbl">Source columns (asset.column, comma separated)<input class="inp mono" placeholder="my-project.staging.orders.net_amount" value="{{fieldForm.sources}}" onChange="{{ffSrc}}"></label>
</div>
<div><button type="button" class="btn" onClick="{{addField}}">Save column</button></div>
</section>
</div>
</sc-if>
</div>
</sc-if>

<!-- ================= LINEAGE ================= -->
<sc-if value="{{isLin}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
<div style="flex: 1 1 320px; position: relative; min-width: 0">
<label class="lbl">Search assets, columns or expressions
<input class="inp" type="search" placeholder="e.g. total_sales, SUM, raw.orders…" autocomplete="off" value="{{lq}}" onChange="{{onLq}}" onKeyDown="{{onLqKey}}">
</label>
<sc-if value="{{hasSugg}}" hint-placeholder-val="{{false}}">
<ul aria-label="Search results" style="position: absolute; z-index: 30; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 6px; list-style: none; background: #FFFFFF; border: 1px solid #C5CED8; border-radius: 10px; box-shadow: 0 10px 28px rgba(21, 32, 43, 0.14); max-height: 340px; overflow: auto">
<sc-for list="{{sugg}}" as="g" hint-placeholder-count="3">
<li><button type="button" onClick="{{g.pick}}" style="width: 100%; text-align: left; min-height: 44px; padding: 8px 10px; border: 0; background: transparent; border-radius: 6px; cursor: pointer; font: inherit; color: #15202B; display: flex; gap: 10px; align-items: center">
<span style="font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: {{g.kbg}}; color: {{g.kfg}}; white-space: nowrap">{{g.kind}}</span>
<span style="display: flex; flex-direction: column; min-width: 0"><span class="mono" style="font-size: 13px; word-break: break-all">{{g.ref}}</span><span style="font-size: 12px; color: #5B6876; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{g.sub}}</span></span>
</button></li>
</sc-for>
</ul>
</sc-if>
<sc-if value="{{noSugg}}" hint-placeholder-val="{{false}}">
<p style="position: absolute; z-index: 30; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 12px; background: #FFFFFF; border: 1px solid #C5CED8; border-radius: 10px; font-size: 13px; color: #4A5765">No matches.</p>
</sc-if>
</div>
<div role="group" aria-label="Zoom" style="display: flex; gap: 4px; align-items: center">
<button type="button" class="btn2" style="min-width: 44px; padding: 0; font-size: 18px" onClick="{{zoomOut}}" aria-label="Zoom out">−</button>
<input type="range" min="20" max="160" step="5" value="{{zoomPct}}" onChange="{{onZoomRange}}" aria-label="Zoom level" style="width: 110px; accent-color: #0F766E">
<button type="button" class="btn2" style="min-width: 44px; padding: 0; font-size: 18px" onClick="{{zoomIn}}" aria-label="Zoom in">+</button>
<button type="button" class="btn2" style="min-width: 64px; padding: 0 8px" onClick="{{zoomReset}}" aria-label="Reset zoom to 100%"><span class="mono" style="font-size: 13px">{{zoomText}}</span></button>
<button type="button" class="btn2" onClick="{{zoomFit}}">Fit to screen</button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
<button type="button" class="btn2" aria-pressed="{{focusOnly}}" style="background: {{focusBg}}; color: {{focusFg}}" onClick="{{toggleFocus}}">Related only</button>
<label class="lbl">Upstream depth<input class="inp" type="number" min="0" max="20" style="width: 110px" value="{{depthUp}}" onChange="{{onDepthUp}}"></label>
<label class="lbl">Downstream depth<input class="inp" type="number" min="0" max="20" style="width: 110px" value="{{depthDown}}" onChange="{{onDepthDown}}"></label>
<label class="lbl">Type
<select class="inp" style="width: 190px" value="{{fType}}" onChange="{{onFType}}"><option value="">All types</option><sc-for list="{{fTypeOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.id}}">{{o.label}}</option></sc-for></select>
</label>
<label class="lbl">Domain
<select class="inp" style="width: 150px" value="{{fDomain}}" onChange="{{onFDomain}}"><option value="">All domains</option><sc-for list="{{fDomainOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.id}}">{{o.id}}</option></sc-for></select>
</label>
<label class="lbl">Relation
<select class="inp" style="width: 150px" value="{{fRel}}" onChange="{{onFRel}}"><option value="">All relations</option><sc-for list="{{fRelOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.id}}">{{o.id}}</option></sc-for></select>
</label>
<label class="lbl">Filter mode
<select class="inp" style="width: 130px" value="{{fMode}}" onChange="{{onFMode}}"><option value="hide">Hide others</option><option value="highlight">Highlight</option></select>
</label>
<label class="lbl">Colour by
<select class="inp" style="width: 120px" value="{{colorBy}}" onChange="{{onColorBy}}"><option value="type">Type</option><option value="domain">Domain</option></select>
</label>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<div role="group" aria-label="Layout" style="display: flex; gap: 0">
<button type="button" class="btn2" aria-pressed="{{isDag}}" style="border-radius: 8px 0 0 8px; background: {{dagBg}}; color: {{dagFg}}" onClick="{{viewDag}}">DAG containers</button>
<button type="button" class="btn2" aria-pressed="{{isFlat}}" style="border-radius: 0; margin-left: -1px; background: {{flatBg}}; color: {{flatFg}}" onClick="{{viewFlat}}">Flat graph</button>
<button type="button" class="btn2" aria-pressed="{{isCustom}}" disabled="{{noLayoutPos}}" title="Positions saved by the Diagram Editor (layout.yaml)" style="border-radius: 0 8px 8px 0; margin-left: -1px; background: {{cusBg}}; color: {{cusFg}}" onClick="{{viewCustom}}">Editor layout</button>
</div>
<sc-if value="{{showOC}}" hint-placeholder-val="{{true}}">
<button type="button" class="btn2" onClick="{{openAll}}">Open all</button>
<button type="button" class="btn2" onClick="{{closeAll}}">Close all</button>
</sc-if>
<button type="button" class="btn2" onClick="{{toggleCols}}">{{colsLabel}}</button>
<sc-if value="{{isFlat}}" hint-placeholder-val="{{false}}">
<button type="button" class="btn2" onClick="{{toggleIso}}">{{isoLabel}}</button>
</sc-if>
<button type="button" class="btn2" onClick="{{toggleMini}}">{{miniLabel}}</button>

<sc-if value="{{hasLoaded}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; background: #F4F6F8; border-radius: 8px">
<span style="font-size: 12px; font-weight: 600; color: #3B4856">LOADED FILES (IN INCLUDE ORDER)</span>
<sc-for list="{{loadedFiles}}" as="lf" hint-placeholder-count="3"><span class="mono" style="font-size: 12px; color: #15202B; word-break: break-all">{{lf.p}}</span></sc-for>
<sc-if value="{{hasUnused}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #9A3412">Not included by main.yaml (ignored): {{unusedText}}</span></sc-if>
</div>
</sc-if>
<details style="font-size: 13px; color: #3B4856">
<summary style="cursor: pointer; min-height: 32px">Supported structure</summary>
<pre class="mono" style="margin: 8px 0 0; padding: 12px; background: #F4F6F8; border-radius: 8px; overflow-x: auto; font-size: 12px; line-height: 1.55">{{schemaHint}}</pre>
</details>
</section>

<section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 14px" aria-labelledby="exp">
<h2 id="exp" style="margin: 0; font-size: 17px; font-weight: 600">Export</h2>
<p style="margin: 0; font-size: 14px; color: #4A5765; line-height: 1.5">Single file: everything in one YAML. Multi-file .zip: <span class="mono">main.yaml</span> + <span class="mono">asset_types.yaml</span> + one file per platform under <span class="mono">assets/</span> + <span class="mono">lineage.yaml</span>.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" class="btn" onClick="{{downloadZip}}">Download .zip (multi-file)</button>
<button type="button" class="btn2" onClick="{{download}}">Download single .yaml</button>
<button type="button" class="btn2" onClick="{{copy}}">Copy text</button>
</div>
<textarea class="inp" rows="22" readOnly="{{true}}" aria-label="Exported YAML (single file)" value="{{yaml}}"></textarea>
</section>

<section class="card" style="grid-column: 1 / -1; padding: 20px; display: flex; flex-direction: column; gap: 14px" aria-labelledby="val-h">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="val-h" style="margin: 0; font-size: 17px; font-weight: 600">Validation</h2>
<span style="font-size: 13px; color: #4A5765">{{valSummary}}</span>
</div>
<label class="lbl">Severity
<select class="inp" style="width: 160px" value="{{vSev}}" onChange="{{onVSev}}"><option value="">All</option><option value="Error">Errors</option><option value="Warning">Warnings</option><option value="Info">Info</option></select>
</label>
</div>
<div style="overflow: auto; max-height: 420px">
<table class="tbl" style="min-width: 720px">
<thead><tr><th scope="col">Severity</th><th scope="col">Item</th><th scope="col">Problem</th><th scope="col"><span style="position: absolute; left: -9999px">Actions</span></th></tr></thead>
<tbody>
<sc-for list="{{valRows}}" as="v" hint-placeholder-count="3">
<tr>
<td><span style="font-size: 12px; padding: 2px 8px; border-radius: 999px; background: {{v.bg}}; color: {{v.fg}}">{{v.sev}}</span></td>
<td class="mono" style="font-size: 12px; word-break: break-all">{{v.item}}</td>
<td>{{v.msg}}</td>
<td style="text-align: right"><sc-if value="{{v.hasPick}}" hint-placeholder-val="{{true}}"><button type="button" class="btn2" style="min-height: 36px" onClick="{{v.pick}}">Show</button></sc-if></td>
</tr>
</sc-for>
</tbody>
</table>
<sc-if value="{{noVal}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 16px; font-size: 14px; color: #4A5765">No problems found.</p></sc-if>
</div>
</section>
</div>
</sc-if>

</main>
</div>
