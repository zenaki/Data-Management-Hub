<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metadata Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F8}
a{color:#0F766E}a:hover{color:#115E59}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.inp{box-sizing:border-box;width:100%;min-height:44px;padding:10px 12px;border:1px solid #C5CED8;border-radius:8px;background:#fff;color:#15202B;font:inherit;font-size:14px}
.inp:focus{outline:2px solid #0F766E;outline-offset:1px;border-color:#0F766E}
textarea.inp{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;line-height:1.55;resize:vertical}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:#3B4856;min-width:0}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #0F766E;background:#0F766E;color:#fff;font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:#115E59}
.btn2{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid #C5CED8;background:#fff;color:#15202B;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.btn2:hover{border-color:#0F766E;color:#0F766E}
.del{min-height:36px;padding:0 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:#B42318;font:inherit;font-size:13px;cursor:pointer}
.del:hover{border-color:#F3C1BC;background:#FEF3F2}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:0;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;text-align:left}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#4A5765;padding:10px 12px;border-bottom:1px solid #D9E0E7;background:#F8FAFB}
.tbl td{padding:10px 12px;border-bottom:1px solid #E6EBF0;vertical-align:top}
.card{background:#fff;border:1px solid #DCE3EA;border-radius:12px}
@media (min-width: 900px){.side{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="dc-template">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #15202B; background: #F4F6F8">

<nav class="side" aria-label="Main navigation" style="flex: 1 1 240px; box-sizing: border-box; background: #15202B; color: #E8EDF2; padding: 24px 16px; display: flex; flex-direction: column; gap: 6px">
<div style="padding: 0 12px 20px; display: flex; flex-direction: column; gap: 4px">
<span class="mono" style="font-size: 12px; letter-spacing: 0.08em; color: #8FD3C9">DATA MANAGEMENT</span>
<span style="font-size: 22px; font-weight: 600">Metadata Hub</span>
</div>
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" class="nav" style="background: {{t.bg}}; color: {{t.fg}}" onClick="{{t.go}}"><span>{{t.label}}</span><span class="mono" style="font-size: 12px; opacity: 0.8">{{t.count}}</span></button>
</sc-for>
<div style="margin-top: 20px; padding: 12px; border-top: 1px solid #2C3A48; font-size: 12px; line-height: 1.5; color: #AAB6C2">No database. YAML is the only source of truth: import to load, export to keep your changes. Nothing is saved when you close the page.</div>
<div style="padding: 0 12px; font-size: 12px; color: #AAB6C2; line-height: 1.5">{{sourceText}}</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600">{{pageTitle}}</h1>
<p style="margin: 0; font-size: 15px; color: #4A5765; max-width: 780px">{{pageDesc}}</p>
</header>

<sc-if value="{{hasMsg}}" hint-placeholder-val="{{false}}">
<div role="status" style="padding: 12px 16px; border-radius: 8px; font-size: 14px; white-space: pre-line; background: {{msgBg}}; color: {{msgFg}}; border: 1px solid {{msgBd}}">{{msg}}</div>
</sc-if>

<sc-if value="{{showEmpty}}" hint-placeholder-val="{{false}}">
<div class="card" style="padding: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
<p style="margin: 0; font-size: 14px; color: #3B4856">Nothing loaded yet. Import a YAML file or a .zip containing main.yaml.</p>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" class="btn" onClick="{{goImport}}">Go to Import</button><button type="button" class="btn2" onClick="{{loadSample}}">Load Airflow + GCP example</button></div>
</div>
</sc-if>

<!-- ================= CATALOG ================= -->
<sc-if value="{{isCatalog}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
<label class="lbl" style="flex: 1 1 320px">Search assets
<input class="inp" type="search" placeholder="id, name, type, owner, tag, property…" value="{{q}}" onChange="{{onQ}}">
</label>
<label class="lbl" style="flex: 0 1 280px">Asset type
<select class="inp" value="{{tf}}" onChange="{{onTf}}"><option value="">All types</option><sc-for list="{{tfOptions}}" as="o" hint-placeholder-count="3"><option value="{{o.id}}">{{o.label}}</option></sc-for></select>
</label>
<span style="font-size: 14px; color: #4A5765; padding-bottom: 12px">{{catalogCount}}</span>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
<article class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span class="mono" style="font-size: 12px; color: #0F766E; word-break: break-all">{{c.id}}</span>
<h2 style="margin: 0; font-size: 18px; font-weight: 600">{{c.name}}</h2>
</div>
<span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; border: 1px solid {{c.tcolor}}; color: {{c.tcolor}}; background: #FFFFFF; white-space: nowrap">{{c.typeLabel}}</span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3B4856">{{c.description}}</p>
<dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px">
<dt style="color: #5B6876">Parent</dt><dd class="mono" style="margin: 0; font-size: 12px; word-break: break-all">{{c.parent}}</dd>
<dt style="color: #5B6876">Domain</dt><dd style="margin: 0">{{c.domain}}</dd>
<dt style="color: #5B6876">Owner</dt><dd style="margin: 0">{{c.owner}}</dd>
<dt style="color: #5B6876">Source</dt><dd class="mono" style="margin: 0; font-size: 12px; word-break: break-all">{{c.source}}</dd>
<dt style="color: #5B6876">Schema</dt><dd style="margin: 0">{{c.fieldCount}} · {{c.linkCount}}</dd>
<dt style="color: #5B6876">File</dt><dd class="mono" style="margin: 0; font-size: 12px; word-break: break-all">{{c.file}}</dd>
<sc-for list="{{c.props}}" as="pp" hint-placeholder-count="2"><dt class="mono" style="color: #5B6876; font-size: 12px">{{pp.k}}</dt><dd class="mono" style="margin: 0; font-size: 12px; word-break: break-all">{{pp.v}}</dd></sc-for>
</dl>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{c.tagList}}" as="tg" hint-placeholder-count="2">
<span class="mono" style="font-size: 12px; padding: 3px 8px; border-radius: 6px; background: #EEF1F4; color: #3B4856">#{{tg.t}}</span>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 4px">
<button type="button" class="btn2" onClick="{{c.toDict}}">Dictionary</button>
<button type="button" class="btn2" onClick="{{c.toLin}}">Lineage</button>
<button type="button" class="del" onClick="{{c.del}}" aria-label="Delete asset {{c.id}}">Delete</button>
</div>
</article>
</sc-for>
</div>

<sc-if value="{{noCards}}" hint-placeholder-val="{{false}}">
<div class="card" style="padding: 24px; font-size: 14px; color: #4A5765">No matching assets.</div>
</sc-if>

<section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 16px" aria-labelledby="add-ds">
<h2 id="add-ds" style="margin: 0; font-size: 17px; font-weight: 600">Add asset</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<label class="lbl">Asset type
<select class="inp" value="{{dsForm.type}}" onChange="{{dsF.type}}"><sc-for list="{{typeOptions}}" as="o" hint-placeholder-count="5"><option value="{{o.id}}">{{o.label}}</option></sc-for></select>
</label>
<label class="lbl">ID (unique)<input class="inp mono" placeholder="my-project.mart.sales_daily" value="{{dsForm.id}}" onChange="{{dsF.id}}"></label>
<label class="lbl">Parent (optional)<input class="inp mono" list="asset-ids" placeholder="airflow.sales_daily.tg_transform" value="{{dsForm.parent}}" onChange="{{dsF.parent}}"></label>
<datalist id="asset-ids"><sc-for list="{{assetIds}}" as="a" hint-placeholder-count="3"><option value="{{a.id}}"></option></sc-for></datalist>
<label class="lbl">Name<input class="inp" placeholder="Daily sales" value="{{dsForm.name}}" onChange="{{dsF.name}}"></label>
<label class="lbl">Domain<input class="inp" placeholder="Sales" value="{{dsForm.domain}}" onChange="{{dsF.domain}}"></label>
<label class="lbl">Owner<input class="inp" placeholder="team / email" value="{{dsForm.owner}}" onChange="{{dsF.owner}}"></label>
<label class="lbl">Source / location<input class="inp mono" placeholder="bq://project.dataset.table" value="{{dsForm.source}}" onChange="{{dsF.source}}"></label>
<label class="lbl">Tags (comma separated)<input class="inp" placeholder="finance, daily" value="{{dsForm.tags}}" onChange="{{dsF.tags}}"></label>
</div>
<label class="lbl">Description<textarea class="inp" rows="2" style="font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px" value="{{dsForm.description}}" onChange="{{dsF.description}}"></textarea></label>
<label class="lbl">Properties (free-form YAML, optional)<textarea class="inp" rows="3" placeholder="operator: BigQueryInsertJobOperator&#10;retries: 2&#10;schedule: &quot;0 1 * * *&quot;" value="{{dsForm.properties}}" onChange="{{dsF.properties}}"></textarea></label>
<div><button type="button" class="btn" onClick="{{addDataset}}">Save asset</button></div>
</section>
</div>
</sc-if>

<!-- ================= DICTIONARY ================= -->
<sc-if value="{{isDict}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 20px">
<sc-if value="{{hasDatasets}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
<label class="lbl" style="flex: 1 1 280px">Asset
<select class="inp mono" value="{{sel}}" onChange="{{onSel}}">
<sc-for list="{{dsOptions}}" as="o" hint-placeholder-count="3"><option value="{{o.id}}">{{o.label}}</option></sc-for>
</select>
</label>
<label class="lbl" style="flex: 1 1 240px">Filter columns
<input class="inp" type="search" placeholder="name, type, description, expression…" value="{{fq}}" onChange="{{onFq}}">
</label>
</div>

<section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 6px">
<span class="mono" style="font-size: 12px; color: #0F766E">{{cur.id}}</span>
<h2 style="margin: 0; font-size: 20px; font-weight: 600">{{cur.name}}</h2>
<p style="margin: 0; font-size: 14px; color: #3B4856; line-height: 1.5">{{cur.description}}</p>
<p style="margin: 0; font-size: 13px; color: #5B6876">{{cur.meta}}</p>
</section>

<div class="card" style="overflow-x: auto">
<table class="tbl" style="min-width: 980px">
<thead><tr><th scope="col">Column</th><th scope="col">Type</th><th scope="col">Nullable</th><th scope="col">PII</th><th scope="col">Description</th><th scope="col">Expression &amp; sources</th><th scope="col"><span style="position: absolute; left: -9999px">Actions</span></th></tr></thead>
<tbody>
<sc-for list="{{fieldRows}}" as="f" hint-placeholder-count="4">
<tr>
<td class="mono" style="font-weight: 500">{{f.name}}</td>
<td class="mono" style="color: #0F766E">{{f.type}}</td>
<td>{{f.nullText}}</td>
<td><span style="font-size: 12px; padding: 3px 8px; border-radius: 999px; background: {{f.piiBg}}; color: {{f.piiFg}}">{{f.piiText}}</span></td>
<td style="color: #3B4856">{{f.description}}</td>
<td style="max-width: 320px">
<sc-if value="{{f.hasExpr}}" hint-placeholder-val="{{false}}"><code class="mono" style="display: block; font-size: 12px; color: #0F766E; white-space: pre-wrap; word-break: break-word; margin-bottom: 4px">{{f.expr}}</code></sc-if>
<span class="mono" style="font-size: 11px; color: #5B6876; word-break: break-all">{{f.srcText}}</span>
</td>
<td style="text-align: right; white-space: nowrap"><button type="button" class="btn2" style="min-height: 36px" onClick="{{f.trace}}" aria-label="Trace lineage of column {{f.name}}">Trace</button> <button type="button" class="del" onClick="{{f.del}}" aria-label="Delete column {{f.name}}">Delete</button></td>
</tr>
</sc-for>
</tbody>
</table>
<sc-if value="{{noFields}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 16px; font-size: 14px; color: #4A5765">No matching columns.</p>
</sc-if>
</div>

<section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 16px" aria-labelledby="add-f">
<h2 id="add-f" style="margin: 0; font-size: 17px; font-weight: 600">Add column to {{cur.id}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; align-items: end">
<label class="lbl">Column name<input class="inp mono" placeholder="order_id" value="{{fieldForm.name}}" onChange="{{ffName}}"></label>
<label class="lbl">Data type<input class="inp mono" list="col-types" placeholder="STRING" value="{{fieldForm.type}}" onChange="{{ffType}}"></label>
<datalist id="col-types"><sc-for list="{{types}}" as="ty" hint-placeholder-count="5"><option value="{{ty.v}}"></option></sc-for></datalist>
<label style="display: flex; gap: 8px; align-items: center; min-height: 44px; font-size: 14px"><input type="checkbox" style="width: 20px; height: 20px" checked="{{fieldForm.nullable}}" onChange="{{ffNull}}"> Nullable</label>
<label style="display: flex; gap: 8px; align-items: center; min-height: 44px; font-size: 14px"><input type="checkbox" style="width: 20px; height: 20px" checked="{{fieldForm.pii}}" onChange="{{ffPii}}"> Personal data (PII)</label>
</div>
<label class="lbl">Description<input class="inp" placeholder="Business meaning of this column" value="{{fieldForm.description}}" onChange="{{ffDesc}}"></label>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px">
<label class="lbl">Expression / transformation (optional)<input class="inp mono" placeholder="SUM(net_amount)" value="{{fieldForm.expression}}" onChange="{{ffExpr}}"></label>
<label class="lbl">Source columns (asset.column, comma separated)<input class="inp mono" placeholder="my-project.staging.orders.net_amount" value="{{fieldForm.sources}}" onChange="{{ffSrc}}"></label>
</div>
<div><button type="button" class="btn" onClick="{{addField}}">Save column</button></div>
</section>
</div>
</sc-if>
</div>
</sc-if>

<!-- ================= LINEAGE ================= -->
<sc-if value="{{isLin}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
<div style="flex: 1 1 360px; position: relative; min-width: 0">
<label class="lbl">Search assets, columns or expressions
<input class="inp" type="search" placeholder="e.g. total_sales, SUM, raw.orders…" autocomplete="off" value="{{lq}}" onChange="{{onLq}}" onKeyDown="{{onLqKey}}">
</label>
<sc-if value="{{hasSugg}}" hint-placeholder-val="{{false}}">
<ul aria-label="Search results" style="position: absolute; z-index: 20; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 6px; list-style: none; background: #FFFFFF; border: 1px solid #C5CED8; border-radius: 10px; box-shadow: 0 10px 28px rgba(21, 32, 43, 0.14); max-height: 340px; overflow: auto">
<sc-for list="{{sugg}}" as="g" hint-placeholder-count="3">
<li><button type="button" onClick="{{g.pick}}" style="width: 100%; text-align: left; min-height: 44px; padding: 8px 10px; border: 0; background: transparent; border-radius: 6px; cursor: pointer; font: inherit; color: #15202B; display: flex; gap: 10px; align-items: center">
<span style="font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: {{g.kbg}}; color: {{g.kfg}}; white-space: nowrap">{{g.kind}}</span>
<span style="display: flex; flex-direction: column; min-width: 0"><span class="mono" style="font-size: 13px; word-break: break-all">{{g.ref}}</span><span style="font-size: 12px; color: #5B6876; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{g.sub}}</span></span>
</button></li>
</sc-for>
</ul>
</sc-if>
<sc-if value="{{noSugg}}" hint-placeholder-val="{{false}}">
<p style="position: absolute; z-index: 20; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 12px; background: #FFFFFF; border: 1px solid #C5CED8; border-radius: 10px; font-size: 13px; color: #4A5765">No matches.</p>
</sc-if>
</div>
<div role="group" aria-label="Zoom" style="display: flex; gap: 4px; align-items: center">
<button type="button" class="btn2" style="min-width: 44px; padding: 0; font-size: 18px" onClick="{{zoomOut}}" aria-label="Zoom out">−</button>
<input type="range" min="20" max="160" step="5" value="{{zoomPct}}" onChange="{{onZoomRange}}" aria-label="Zoom level" style="width: 120px; accent-color: #0F766E">
<button type="button" class="btn2" style="min-width: 44px; padding: 0; font-size: 18px" onClick="{{zoomIn}}" aria-label="Zoom in">+</button>
<button type="button" class="btn2" style="min-width: 64px; padding: 0 8px" onClick="{{zoomReset}}" aria-label="Reset zoom to 100%"><span class="mono" style="font-size: 13px">{{zoomText}}</span></button>
<button type="button" class="btn2" onClick="{{zoomFit}}">Fit to screen</button>
</div>
<button type="button" class="btn2" onClick="{{toggleCols}}">{{colsLabel}}</button>
<button type="button" class="btn2" onClick="{{toggleIso}}">{{isoLabel}}</button>
<button type="button" class="btn2" aria-pressed="{{focusOnly}}" style="background: {{focusBg}}; color: {{focusFg}}" onClick="{{toggleFocus}}">Related only</button>
<button type="button" class="btn2" onClick="{{resetView}}">Reset</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: #3B4856; align-items: center">
<span>Click an asset header or a column name to trace it:</span>
<span style="display: inline-flex; gap: 6px; align-items: center"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; background: #0F766E"></span>Selected</span>
<span style="display: inline-flex; gap: 6px; align-items: center"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; background: #DBEAFE; border: 2px solid #1D4ED8"></span>Upstream</span>
<span style="display: inline-flex; gap: 6px; align-items: center"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; background: #FFEDD5; border: 2px solid #C2410C"></span>Downstream</span>
<span style="display: inline-flex; gap: 6px; align-items: center"><span class="mono" style="font-size: 11px; color: #0F766E">ƒx</span>has an expression</span>
<span style="color: #5B6876">Ctrl/⌘ + scroll or pinch to zoom · drag the background to pan</span>
</div>
</div>

<div class="card" ref="{{diagRef}}" style="overflow: auto; max-height: 680px; background: #FBFCFD; cursor: grab">
<div style="position: relative; width: {{cw}}px; height: {{chh}}px">
<div style="position: absolute; left: 0; top: 0; width: {{baseW}}px; height: {{baseH}}px; transform: scale({{zoom}}); transform-origin: 0 0">
<sc-for list="{{paths}}" as="p" hint-placeholder-count="3">
<svg aria-hidden="true" width="1" height="1" style="position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; opacity: {{p.op}}"><path d="{{p.d}}" style="fill: none; stroke: {{p.color}}; stroke-width: {{p.w}}px"></path><path d="{{p.head}}" style="fill: {{p.color}}; stroke: none"></path></svg>
</sc-for>
<sc-for list="{{nodes}}" as="n" hint-placeholder-count="3">
<div style="position: absolute; left: {{n.x}}px; top: {{n.y}}px; width: 240px; height: {{n.h}}px; box-sizing: border-box; border-radius: 10px; background: #FFFFFF; border: 2px solid {{n.bd}}; opacity: {{n.op}}; overflow: hidden; box-shadow: 0 1px 3px rgba(21, 32, 43, 0.08)">
<button type="button" title="{{n.id}}" onClick="{{n.pick}}" style="width: 100%; height: 58px; box-sizing: border-box; padding: 8px 12px; border: 0; background: {{n.bg}}; color: {{n.fg}}; text-align: left; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 2px; justify-content: center">
<span style="display: flex; gap: 6px; align-items: center; max-width: 100%"><span aria-hidden="true" style="flex: none; width: 9px; height: 9px; border-radius: 50%; background: {{n.tcolor}}; box-shadow: 0 0 0 2px #FFFFFF"></span><span class="mono" style="font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{n.id}}</span></span>
<span style="font-size: 11px; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%">{{n.typeLabel}} · {{n.name}}</span>
</button>
<sc-if value="{{n.showCols}}" hint-placeholder-val="{{true}}">
<div style="padding: 4px 0; border-top: 1px solid #E6EBF0">
<sc-for list="{{n.cols}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" title="{{c.title}}" style="width: 100%; height: 26px; border: 0; padding: 0 12px; display: flex; justify-content: space-between; gap: 8px; align-items: center; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 12px; font-weight: {{c.fw}}; cursor: pointer; text-align: left"><span class="mono" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.name}}</span><span class="mono" style="font-size: 10px; opacity: 0.75; white-space: nowrap">{{c.badge}}</span></button>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>
</div>
<sc-if value="{{noNodes}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 20px; font-size: 14px; color: #4A5765">No lineage nodes yet.</p>
</sc-if>
</div>

<sc-if value="{{hasColTrace}}" hint-placeholder-val="{{false}}">
<section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 16px" aria-labelledby="trace-h">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="trace-h" style="margin: 0; font-size: 17px; font-weight: 600">How <span class="mono" style="color: #0F766E">{{ct.ref}}</span> is calculated</h2>
<p style="margin: 0; font-size: 13px; color: #4A5765">{{ct.summary}}</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: #1D4ED8">UPSTREAM — CALCULATION CHAIN DOWN TO THE SOURCE</span>
<sc-for list="{{traceUp}}" as="u" hint-placeholder-count="3">
<button type="button" onClick="{{u.pick}}" style="margin-left: {{u.indent}}px; text-align: left; padding: 8px 10px; min-height: 44px; border: 1px solid {{u.bd}}; border-radius: 8px; background: {{u.bg}}; cursor: pointer; font: inherit; color: #15202B; display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap"><span aria-hidden="true" style="color: #8996A3">{{u.arrow}}</span><span class="mono" style="font-size: 13px; font-weight: 500; word-break: break-all">{{u.ref}}</span><span class="mono" style="font-size: 11px; color: #5B6876">{{u.type}}</span></span>
<sc-if value="{{u.hasExpr}}" hint-placeholder-val="{{true}}"><code class="mono" style="font-size: 12px; color: #0F766E; background: #E7F4F2; padding: 3px 6px; border-radius: 4px; white-space: pre-wrap; word-break: break-word">= {{u.line}}</code></sc-if>
<sc-if value="{{u.noExpr}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #5B6876; font-style: italic">{{u.line}}</span></sc-if>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: #C2410C">DOWNSTREAM — COLUMNS THAT USE IT</span>
<sc-for list="{{traceDown}}" as="u" hint-placeholder-count="2">
<button type="button" onClick="{{u.pick}}" style="margin-left: {{u.indent}}px; text-align: left; padding: 8px 10px; min-height: 44px; border: 1px solid #F5D0B5; border-radius: 8px; background: #FFF7ED; cursor: pointer; font: inherit; color: #15202B; display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap"><span aria-hidden="true" style="color: #8996A3">{{u.arrow}}</span><span class="mono" style="font-size: 13px; font-weight: 500; word-break: break-all">{{u.ref}}</span><span class="mono" style="font-size: 11px; color: #5B6876">{{u.type}}</span></span>
<sc-if value="{{u.hasExpr}}" hint-placeholder-val="{{true}}"><code class="mono" style="font-size: 12px; color: #9A3412; white-space: pre-wrap; word-break: break-word">= {{u.line}}</code></sc-if>
<sc-if value="{{u.noExpr}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #5B6876; font-style: italic">{{u.line}}</span></sc-if>
</button>
</sc-for>
<sc-if value="{{noDown}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 13px; color: #5B6876">No other column uses this column.</p></sc-if>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{hasDsFocus}}" hint-placeholder-val="{{false}}">
<section class="card" style="padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; font-size: 14px">
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; color: #1D4ED8; font-weight: 600">UPSTREAM OF {{focus.id}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{upChips}}" as="h" hint-placeholder-count="2"><button type="button" class="btn2 mono" style="min-height: 36px; font-size: 12px" onClick="{{h.pick}}">{{h.id}}</button></sc-for></div>
<sc-if value="{{noUpChips}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: #5B6876">None — this is a source.</span></sc-if></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; color: #C2410C; font-weight: 600">DOWNSTREAM OF {{focus.id}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{downChips}}" as="h" hint-placeholder-count="2"><button type="button" class="btn2 mono" style="min-height: 36px; font-size: 12px" onClick="{{h.pick}}">{{h.id}}</button></sc-for></div>
<sc-if value="{{noDownChips}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: #5B6876">None — this is the end of the flow.</span></sc-if></div>
<p style="margin: 0; font-size: 13px; color: #4A5765; grid-column: 1 / -1">Click a column name in the diagram to see its expression and where its values come from.</p>
</section>
</sc-if>

<div class="card" style="overflow-x: auto">
<table class="tbl" style="min-width: 720px">
<thead><tr><th scope="col">From (source)</th><th scope="col">To (target)</th><th scope="col">Relation</th><th scope="col">Process / transformation</th><th scope="col"><span style="position: absolute; left: -9999px">Actions</span></th></tr></thead>
<tbody>
<sc-for list="{{edgeRows}}" as="e" hint-placeholder-count="3">
<tr>
<td class="mono">{{e.from}}</td>
<td class="mono">{{e.to}}</td>
<td><span class="mono" style="font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #EEF1F4; white-space: nowrap">{{e.type}}</span></td>
<td style="color: #3B4856">{{e.process}}</td>
<td style="text-align: right"><button type="button" class="del" onClick="{{e.del}}" aria-label="Delete relation">Delete</button></td>
</tr>
</sc-for>
</tbody>
</table>
</div>

<section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 16px" aria-labelledby="add-e">
<h2 id="add-e" style="margin: 0; font-size: 17px; font-weight: 600">Add lineage relation</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<label class="lbl">From
<select class="inp mono" value="{{edgeForm.from}}" onChange="{{efFrom}}">
<option value="">— select —</option>
<sc-for list="{{dsOptions}}" as="o" hint-placeholder-count="3"><option value="{{o.id}}">{{o.id}}</option></sc-for>
</select>
</label>
<label class="lbl">To
<select class="inp mono" value="{{edgeForm.to}}" onChange="{{efTo}}">
<option value="">— select —</option>
<sc-for list="{{dsOptions}}" as="o" hint-placeholder-count="3"><option value="{{o.id}}">{{o.id}}</option></sc-for>
</select>
</label>
<label class="lbl">Relation type<input class="inp mono" list="rel-types" placeholder="reads, writes, triggers…" value="{{edgeForm.type}}" onChange="{{efType}}"></label>
<datalist id="rel-types"><sc-for list="{{relTypes}}" as="r" hint-placeholder-count="3"><option value="{{r.v}}"></option></sc-for></datalist>
<label class="lbl">Process<input class="inp" placeholder="Daily MERGE, CALL sp_…" value="{{edgeForm.process}}" onChange="{{efProc}}"></label>
</div>
<div><button type="button" class="btn" onClick="{{addEdge}}">Save relation</button></div>
</section>
</div>
</sc-if>

<!-- ================= YAML ================= -->
<sc-if value="{{isYaml}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; align-items: start">
<section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 14px" aria-labelledby="imp">
<h2 id="imp" style="margin: 0; font-size: 17px; font-weight: 600">Import</h2>
<p style="margin: 0; font-size: 14px; color: #4A5765; line-height: 1.5">Upload one .yaml file, several .yaml files, or a .zip. With several files, <span class="mono">main.yaml</span> is the entry point and pulls in the rest through <span class="mono">include:</span> (paths and <span class="mono">*</span> / <span class="mono">**</span> globs, relative to the file).</p>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px">
<legend style="font-size: 13px; font-weight: 500; color: #3B4856; margin-bottom: 8px">Mode</legend>
<label style="display: flex; gap: 8px; align-items: center; min-height: 44px"><input type="radio" name="mode" style="width: 18px; height: 18px" checked="{{modeReplace}}" onChange="{{setReplace}}"> Replace everything</label>
<label style="display: flex; gap: 8px; align-items: center; min-height: 44px"><input type="radio" name="mode" style="width: 18px; height: 18px" checked="{{modeMerge}}" onChange="{{setMerge}}"> Merge (update by id)</label>
</fieldset>
<label class="lbl">Choose files (.zip, .yaml, .yml)<input class="inp" type="file" multiple="{{true}}" onChange="{{onFile}}" onInput="{{onFile}}"></label>
<div onDragOver="{{onDragOver}}" onDrop="{{onDrop}}" style="padding: 20px; border: 2px dashed #9AA7B4; border-radius: 10px; text-align: center; font-size: 14px; color: #3B4856; background: #F8FAFB">…or drag and drop .zip / .yaml files here</div>
<label class="lbl">…or paste a single YAML document<textarea class="inp" rows="10" placeholder="version: 2&#10;assets:&#10;  - id: ..." value="{{importText}}" onChange="{{onImportText}}"></textarea></label>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" class="btn" onClick="{{applyPaste}}">Apply YAML</button><button type="button" class="btn2" onClick="{{loadSample}}">Load Airflow + GCP example</button></div>
<sc-if value="{{hasLoaded}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; background: #F4F6F8; border-radius: 8px">
<span style="font-size: 12px; font-weight: 600; color: #3B4856">LOADED FILES (IN INCLUDE ORDER)</span>
<sc-for list="{{loadedFiles}}" as="lf" hint-placeholder-count="3"><span class="mono" style="font-size: 12px; color: #15202B; word-break: break-all">{{lf.p}}</span></sc-for>
<sc-if value="{{hasUnused}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #9A3412">Not included by main.yaml (ignored): {{unusedText}}</span></sc-if>
</div>
</sc-if>
<details style="font-size: 13px; color: #3B4856">
<summary style="cursor: pointer; min-height: 32px">Supported structure</summary>
<pre class="mono" style="margin: 8px 0 0; padding: 12px; background: #F4F6F8; border-radius: 8px; overflow-x: auto; font-size: 12px; line-height: 1.55">{{schemaHint}}</pre>
</details>
</section>

<section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 14px" aria-labelledby="exp">
<h2 id="exp" style="margin: 0; font-size: 17px; font-weight: 600">Export</h2>
<p style="margin: 0; font-size: 14px; color: #4A5765; line-height: 1.5">Single file: everything in one YAML. Multi-file .zip: <span class="mono">main.yaml</span> + <span class="mono">asset_types.yaml</span> + one file per platform under <span class="mono">assets/</span> + <span class="mono">lineage.yaml</span>.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" class="btn" onClick="{{downloadZip}}">Download .zip (multi-file)</button>
<button type="button" class="btn2" onClick="{{download}}">Download single .yaml</button>
<button type="button" class="btn2" onClick="{{copy}}">Copy text</button>
</div>
<textarea class="inp" rows="22" readOnly="{{true}}" aria-label="Exported YAML (single file)" value="{{yaml}}"></textarea>
</section>
</div>
</sc-if>

</main>
</div>
</script>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="dc-runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 'yaml', types: this.defaultTypes(), datasets: [], lineage: [], tf: '', hideIso: true,
      sel: null, linSel: null, linCol: null, q: '', fq: '', lq: '', zoom: 0.9, showCols: true, focusOnly: false,
      dsForm: this.emptyDs(), fieldForm: this.emptyField(), edgeForm: { from: '', to: '', type: '', process: '' },
      importText: '', mode: 'replace', msg: '', msgKind: 'ok', loaded: [], unused: [], sourceName: ''
    };
    this.diagRef = this.attachDiagram.bind(this);
  }

  /* ---------- diagram zoom (ctrl/cmd + wheel, pinch) and drag-to-pan ---------- */
  zoomTo(nz, mx, my) {
    var el = this._diag, z = this.state.zoom;
    nz = Math.round(Math.max(0.2, Math.min(1.6, nz)) * 100) / 100;
    if (!el) { this.setState({ zoom: nz }); return; }
    if (mx === undefined) { mx = el.clientWidth / 2; my = el.clientHeight / 2; }
    var sx = (el.scrollLeft + mx) / z, sy = (el.scrollTop + my) / z;
    this.setState({ zoom: nz }, function () { el.scrollLeft = sx * nz - mx; el.scrollTop = sy * nz - my; });
  }
  attachDiagram(el) {
    var self = this;
    if (this._diag === el) return;
    if (this._diag) { this._diag.removeEventListener('wheel', this._onWheel); this._diag.removeEventListener('mousedown', this._onDown); }
    this._diag = el;
    if (!el) return;
    if (!this._onWheel) {
      this._onWheel = function (e) {
        if (!(e.ctrlKey || e.metaKey)) return;
        e.preventDefault();
        var r = self._diag.getBoundingClientRect();
        self.zoomTo(self.state.zoom * Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
      };
      this._onDown = function (e) {
        if (e.button !== 0 || (e.target.closest && e.target.closest('button,input,a'))) return;
        var d = self._diag;
        self._pan = { x: e.clientX, y: e.clientY, l: d.scrollLeft, t: d.scrollTop };
        d.style.cursor = 'grabbing';
        e.preventDefault();
      };
      this._onMove = function (e) { var p = self._pan, d = self._diag; if (!p || !d) return; d.scrollLeft = p.l - (e.clientX - p.x); d.scrollTop = p.t - (e.clientY - p.y); };
      this._onUp = function () { if (self._pan) { self._pan = null; if (self._diag) self._diag.style.cursor = 'grab'; } };
      window.addEventListener('mousemove', this._onMove);
      window.addEventListener('mouseup', this._onUp);
    }
    el.addEventListener('wheel', this._onWheel, { passive: false });
    el.addEventListener('mousedown', this._onDown);
  }
  componentWillUnmount() {
    if (this._onMove) { window.removeEventListener('mousemove', this._onMove); window.removeEventListener('mouseup', this._onUp); }
    this.attachDiagram(null);
  }

  emptyDs() { return { id: '', type: 'bigquery.table', parent: '', name: '', domain: '', owner: '', source: '', tags: '', description: '', properties: '' }; }
  emptyField() { return { name: '', type: 'STRING', nullable: true, pii: false, description: '', expression: '', sources: '' }; }
  mergeTypes(base, inc) { var out = base.slice(); (inc || []).forEach(function (t) { var i = out.findIndex(function (x) { return x.id === t.id; }); if (i >= 0) out[i] = t; else out.push(t); }); return out; }
  defaultTypes() {
    return [
      ['airflow.dag', 'Airflow DAG', 'Airflow', '#0B5CAD'], ['airflow.task_group', 'Airflow Task Group', 'Airflow', '#1E40AF'], ['airflow.task', 'Airflow Task', 'Airflow', '#1D4ED8'],
      ['airflow.variable', 'Airflow Variable', 'Airflow', '#3730A3'], ['airflow.connection', 'Airflow Connection', 'Airflow', '#3730A3'],
      ['bigquery.project', 'BigQuery Project', 'BigQuery', '#115E59'], ['bigquery.dataset', 'BigQuery Dataset', 'BigQuery', '#0F766E'], ['bigquery.table', 'BigQuery Table', 'BigQuery', '#0F766E'],
      ['bigquery.view', 'BigQuery View', 'BigQuery', '#0E7490'], ['bigquery.materialized_view', 'BigQuery Materialized View', 'BigQuery', '#0E7490'],
      ['bigquery.stored_procedure', 'BigQuery Stored Procedure', 'BigQuery', '#155E75'], ['bigquery.udf', 'BigQuery UDF', 'BigQuery', '#155E75'],
      ['vertex.pipeline', 'Vertex AI Pipeline', 'Vertex AI', '#6D28D9'], ['vertex.pipeline_component', 'Vertex Pipeline Component', 'Vertex AI', '#6D28D9'],
      ['vertex.model', 'Model Registry Model', 'Vertex AI', '#7E22CE'], ['vertex.endpoint', 'Vertex AI Endpoint', 'Vertex AI', '#86198F'], ['vertex.feature_view', 'Vertex Feature View', 'Vertex AI', '#86198F'],
      ['artifact_registry.repository', 'Artifact Registry Repository', 'Artifact Registry', '#9A3412'], ['artifact_registry.image', 'Artifact Registry Image', 'Artifact Registry', '#C2410C'],
      ['gcs.bucket', 'GCS Bucket', 'Cloud Storage', '#A16207'], ['gcs.object', 'GCS Object / Path', 'Cloud Storage', '#A16207'],
      ['dataset', 'Dataset (generic)', 'Generic', '#475569'], ['external', 'External system', 'Generic', '#475569']
    ].map(function (t) { return { id: t[0], label: t[1], category: t[2], color: t[3] }; });
  }

  sample() {
    var F = function (name, type, nullable, pii, description, expression, sources) { return { name: name, type: type, nullable: nullable, pii: pii, description: description, expression: expression || '', sources: sources || [] }; };
    var A = function (id, type, name, o) { return Object.assign({ id: id, type: type, name: name, parent: '', domain: '', owner: '', source: '', description: '', tags: [], properties: {}, fields: [], file: 'example' }, o || {}); };
    var E = function (from, to, type, process) { return { from: from, to: to, type: type, process: process || '', properties: {} }; };
    var doms = [
      { k: 'sales', T: 'Sales', ent: 'customer', ev: 'order', ts: 'order_ts', m: 'amount', adj: 'discount', U: 'NUMERIC', owner: 'sales-data', src: 'ERP', model: 'sales_forecast' },
      { k: 'inventory', T: 'Inventory', ent: 'sku', ev: 'movement', ts: 'movement_ts', m: 'quantity', adj: 'damaged_qty', U: 'INT64', owner: 'supply-data', src: 'WMS', model: 'stock_forecast' },
      { k: 'finance', T: 'Finance', ent: 'account', ev: 'txn', ts: 'txn_ts', m: 'amount', adj: 'fee', U: 'NUMERIC', owner: 'finance-data', src: 'Core banking', model: 'cashflow_forecast' },
      { k: 'marketing', T: 'Marketing', ent: 'campaign', ev: 'click', ts: 'click_ts', m: 'cost', adj: 'refund', U: 'NUMERIC', owner: 'growth-data', src: 'Ads platform', model: 'roas_forecast' },
      { k: 'support', T: 'Support', ent: 'customer', ev: 'ticket', ts: 'opened_ts', m: 'handle_minutes', adj: 'wait_minutes', U: 'INT64', owner: 'cx-data', src: 'Helpdesk', model: 'ticket_volume_forecast' }
    ];
    var assets = [], lin = [];
    doms.forEach(function (o) {
      var k = o.k, T = o.T, U = o.U, P = 'acme-' + k, ev = o.ev, ent = o.ent, idc = ev + '_id', entc = ent + '_id';
      var raw = P + '.raw.' + ev + 's', stg = P + '.staging.' + ev + 's_clean', mart = P + '.mart.' + k + '_daily', view = P + '.mart.v_' + k + '_features', mv = P + '.mart.mv_' + k + '_monthly', sp = P + '.mart.sp_build_' + k + '_daily', udf = P + '.staging.fn_clean_' + o.m;
      var dag = 'airflow.' + k + '_daily', tg = dag + '.tg_transform', tLoad = tg + '.load_staging', tSp = tg + '.call_sp', tTrain = dag + '.trigger_training';
      var vVar = 'airflow.variable.' + k + '_gcp_project', vCon = 'airflow.connection.bq_' + k;
      var vp = 'vertex.pipeline.' + o.model, vc = vp + '.train', mdl = 'vertex.model.' + o.model, ep = 'vertex.endpoint.' + o.model, fv = 'vertex.feature_view.' + k + '_features';
      var repo = 'artifact_registry.ml-' + k, img = repo + '.' + k + '-trainer';
      var bkt = 'gcs.acme-' + k + '-landing', obj = bkt + '/' + ev + 's', ext = 'external.' + o.src.toLowerCase().replace(/[^a-z]+/g, '_'), sheet = 'sheet.' + k + '_targets';
      assets.push(
        A(ext, 'external', o.src + ' system', { domain: T, owner: o.owner, description: 'Operational source system for ' + k + ' data.', properties: { vendor: o.src, extract: 'daily file export' } }),
        A(sheet, 'dataset', T + ' targets sheet', { domain: T, owner: o.owner, source: 'Google Sheets', description: 'Monthly targets maintained by the business.', fields: [F('month', 'DATE', false, false, 'Target month.'), F('target_value', U, false, false, 'Monthly target.')] }),
        A(bkt, 'gcs.bucket', 'Landing bucket ' + k, { domain: T, owner: 'platform', properties: { location: 'asia-southeast2', storage_class: 'STANDARD' } }),
        A(obj, 'gcs.object', ev + 's landing files', { parent: bkt, domain: T, properties: { pattern: ev + 's/dt={{ ds }}/*.parquet', format: 'parquet' } }),
        A(P, 'bigquery.project', 'GCP project ' + k, { domain: T, owner: 'platform', properties: { region: 'asia-southeast2', billing_account: 'acme-billing' } }),
        A(P + '.raw', 'bigquery.dataset', 'raw', { parent: P, domain: T, properties: { location: 'asia-southeast2', default_table_expiration_days: 400 } }),
        A(P + '.staging', 'bigquery.dataset', 'staging', { parent: P, domain: T, properties: { location: 'asia-southeast2' } }),
        A(P + '.mart', 'bigquery.dataset', 'mart', { parent: P, domain: T, properties: { location: 'asia-southeast2' } }),
        A(raw, 'bigquery.table', T + ' ' + ev + 's (raw)', { parent: P + '.raw', domain: T, owner: o.owner, source: o.src + ' via GCS', description: 'As-is ' + ev + ' records loaded from the landing bucket.', tags: ['raw'], properties: { partition_by: 'DATE(' + o.ts + ')' }, fields: [
          F(idc, 'INT64', false, false, 'Unique ' + ev + ' ID.'),
          F(entc, 'INT64', false, ent === 'customer', 'Reference to the ' + ent + '.'),
          F(o.ts, 'TIMESTAMP', false, false, 'Event time (UTC).'),
          F(o.m, U, true, false, 'Raw ' + o.m.replace(/_/g, ' ') + '.'),
          F(o.adj, U, true, false, 'Adjustment (' + o.adj.replace(/_/g, ' ') + ').')
        ] }),

    };

    // yaml
    var save = function (blob, name, okMsg) {
      try {
        var u = URL.createObjectURL(blob), a = document.createElement('a');

    var stamp = new Date().toISOString().slice(0, 10);
    var download = function () { save(new Blob([self.toYaml()], { type: 'application/x-yaml' }), 'metadata-hub-' + stamp + '.yaml', 'Single YAML file downloaded.'); };
    var downloadZip = function () { var f = self.toFiles(); save(self.makeZip(f), 'metadata-hub-' + stamp + '.zip', 'Zip downloaded with ' + Object.keys(f).length + ' files (main.yaml is the entry point).'); };
    var copy = function () {
      try { navigator.clipboard.writeText(self.toYaml()).then(function () { say('YAML copied to the clipboard.'); }, function () { say('Could not copy automatically — select the text in the box and copy it.', 'err'); }); }

    };
    var readList = function (list, input) {
      if (!list.length) return;

    var msgPal = s.msgKind === 'err' ? ['#FEF3F2', '#912018', '#F3C1BC'] : ['#ECFDF3', '#05603A', '#A6E9C5'];

    return {
      tabs: tabs, pageTitle: titles[s.tab][0], pageDesc: titles[s.tab][1],

      tfOptions: s.types.filter(function (t) { return ds.some(function (d) { return d.type === t.id; }); }).concat(ds.filter(function (d) { return !tmap[d.type]; }).map(function (d) { return tinfo(d.type); }).filter(function (t, i, a) { return a.findIndex(function (x) { return x.id === t.id; }) === i; })).map(function (t) { return { id: t.id, label: t.label + ' (' + ds.filter(function (d) { return d.type === t.id; }).length + ')' }; }),
      typeOptions: s.types.slice().sort(function (a, b) { return a.category === b.category ? 0 : a.category < b.category ? -1 : 1; }).map(function (t) { return { id: t.id, label: t.category + ' — ' + t.label }; }),
      assetIds: ds.map(function (d) { return { id: d.id }; }),
      cards: cards, noCards: cards.length === 0 && ds.length > 0, dsForm: s.dsForm, dsF: dsF, addDataset: addDataset,
      hasDatasets: ds.length > 0,
      sel: cur ? cur.id : '', onSel: function (e) { set({ sel: e.target.value }); },
      dsOptions: ds.map(function (d) { return { id: d.id, label: d.id + ' — ' + d.name }; }),
      fq: s.fq, onFq: function (e) { set({ fq: e.target.value }); },
      cur: cur ? { id: cur.id, name: cur.name, description: cur.description || 'No description yet.', meta: tinfo(cur.type).label + ' · Parent: ' + (cur.parent || '—') + ' · Domain: ' + (cur.domain || '—') + ' · Owner: ' + (cur.owner || '—') + ' · ' + cur.fields.length + ' columns · ' + cur.fields.filter(function (f) { return f.pii; }).length + ' PII' } : { id: '', name: '', description: '', meta: '' },
      fieldRows: fieldRows, noFields: fieldRows.length === 0,
      fieldForm: s.fieldForm, ffName: form('fieldForm', 'name'), ffType: form('fieldForm', 'type'), ffNull: form('fieldForm', 'nullable', true), ffPii: form('fieldForm', 'pii', true), ffDesc: form('fieldForm', 'description'), ffExpr: form('fieldForm', 'expression'), ffSrc: form('fieldForm', 'sources'),
      types: ['STRING', 'INT64', 'NUMERIC', 'BIGNUMERIC', 'FLOAT64', 'BOOL', 'DATE', 'DATETIME', 'TIMESTAMP', 'TIME', 'JSON', 'BYTES', 'GEOGRAPHY', 'ARRAY', 'STRUCT'].map(function (v) { return { v: v }; }),
      addField: addField,
      nodes: nodes, paths: paths, noNodes: visible.length === 0,
      baseW: baseW, baseH: baseH, cw: Math.round(baseW * z), chh: Math.round(baseH * z), zoom: z, zoomText: Math.round(z * 100) + '%',
      zoomIn: function () { self.zoomTo(self.state.zoom * 1.2); },
      zoomOut: function () { self.zoomTo(self.state.zoom / 1.2); },
      zoomReset: function () { self.zoomTo(1); },

      zoomFit: function () {

      edgeRows: edgeRows, edgeForm: s.edgeForm, efFrom: form('edgeForm', 'from'), efTo: form('edgeForm', 'to'), efProc: form('edgeForm', 'process'), efType: form('edgeForm', 'type'), addEdge: addEdge,
      relTypes: ['reads', 'writes', 'calls', 'triggers', 'uses', 'produces', 'configures', 'deploys', 'depends_on'].map(function (v) { return { v: v }; }),
      loadSample: function () { var d = self.sample(); set({ types: d.types, datasets: d.datasets, lineage: d.lineage, sel: 'acme-sales.mart.sales_daily', linSel: null, linCol: 'acme-sales.mart.sales_daily.total_sales', focusOnly: true, tf: '', loaded: [], unused: [], sourceName: 'built-in example', tab: 'lineage', msg: 'Loaded the example: 5 domains, ' + d.datasets.length + ' assets, at least 5 of every asset type (replaced the current data). Showing the trace of total_sales — press Reset to see everything.', msgKind: 'ok' }); },
      yaml: this.toYaml(), download: download, downloadZip: downloadZip, copy: copy, onFile: onFile, onDragOver: onDragOver, onDrop: onDrop,
      importText: s.importText, onImportText: function (e) { set({ importText: e.target.value }); },
      applyPaste: function () {
        if (!self.state.importText.trim()) return say('Paste some YAML first.', 'err');
        try { self.applyLoaded(self.loadProject({ 'main.yaml': self.state.importText }), 'pasted text'); } catch (err) { say('Import failed — ' + err.message, 'err'); }
      },
      modeMerge: s.mode === 'merge', modeReplace: s.mode === 'replace',
      setMerge: function () { set({ mode: 'merge' }); }, setReplace: function () { set({ mode: 'replace' }); },
      hasLoaded: s.loaded.length > 0, loadedFiles: s.loaded.map(function (p) { return { p: p }; }), hasUnused: s.unused.length > 0, unusedText: s.unused.join(', '),
      schemaHint: '# main.yaml  (entry point of a .zip)\nversion: 2\ninclude:                     # paths relative to this file\n  - asset_types.yaml\n  - airflow/**/*.yaml          # * and ** globs\n  - bigquery/*.yaml\n  - lineage.yaml\n\n# any included file may hold any of:\nasset_types:                 # optional — your own types\n  - id: dbt.model\n    label: dbt Model\n    category: dbt\n    color: "#B45309"\nassets:                      # (legacy alias: datasets)\n  - id: proj.mart.sales_daily  # required, unique\n    type: bigquery.table       # any type id\n    name: Daily sales\n    parent: proj.mart          # hierarchy (DAG > group > task)\n    owner: bi-team\n    properties:                # free-form, may be nested\n      partition_by: order_date\n    retention_days: 400        # unknown keys -> properties\n    fields:                    # (alias: columns)\n      - name: total_sales\n        type: NUMERIC\n        expression: SUM(net_amount)\n        sources: [proj.staging.orders.net_amount]\nlineage:\n  - from: airflow.dag_x.task_y\n    to: proj.mart.sales_daily\n    type: writes               # reads, writes, calls, triggers…\n    process: Daily MERGE\ninclude: [more/*.yaml]       # nested includes are allowed'
    };
  }

  updateFields(id, fn) {
