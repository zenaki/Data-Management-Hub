<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metadata Hub · Diagram Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F8}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.inp{box-sizing:border-box;width:100%;min-height:36px;padding:6px 10px;border:1px solid #C5CED8;border-radius:6px;background:#fff;color:#15202B;font:inherit;font-size:13px}
.inp:focus{outline:2px solid #0F766E;outline-offset:1px;border-color:#0F766E}
textarea.inp{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;line-height:1.5;resize:vertical}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:#3B4856;min-width:0}
.tb{min-height:36px;padding:0 12px;border-radius:6px;border:1px solid #C5CED8;background:#fff;color:#15202B;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none;box-sizing:border-box}
.tb:hover{border-color:#0F766E;color:#0F766E}
.tb:disabled{opacity:.45;cursor:default}
.pri{background:#0F766E;border-color:#0F766E;color:#fff}
.pri:hover{background:#115E59;color:#fff}
.del{min-height:32px;padding:0 10px;border-radius:6px;border:1px solid #F3C1BC;background:#fff;color:#B42318;font:inherit;font-size:12px;cursor:pointer}
.del:hover{background:#FEF3F2}
.pal{width:100%;min-height:34px;padding:0 10px;border:1px solid transparent;border-radius:6px;background:transparent;color:#15202B;font:inherit;font-size:13px;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center}
.pal:hover{background:#EEF1F4;border-color:#DCE3EA}
.sec{font-size:11px;font-weight:600;letter-spacing:.06em;color:#4A5765;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:2px 4px 2px 8px;border-radius:999px;background:#F3E8FF;color:#6B21A8;font-size:11px}
.pt{position:absolute;width:12px;height:12px;box-sizing:border-box;border-radius:50%;background:#0F766E;border:2px solid #fff;box-shadow:0 0 0 1px #0F766E;cursor:crosshair;opacity:.0;z-index:3}
.nd:hover>.pt,.nd.on>.pt,.dragging .pt{opacity:1}
.pt:hover{background:#CA8A04;box-shadow:0 0 0 1px #CA8A04}
.chip button{border:0;background:transparent;color:#6B21A8;cursor:pointer;font-size:14px;line-height:1;padding:0 4px;min-height:22px}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="dc-template">
<div style="height: 100vh; display: flex; flex-direction: column; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #15202B; background: #F4F6F8">

<header style="flex: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: #15202B; color: #E8EDF2">
<div style="display: flex; flex-direction: column; margin-right: 8px">
<span class="mono" style="font-size: 11px; letter-spacing: 0.08em; color: #8FD3C9">METADATA HUB</span>
<span style="font-size: 17px; font-weight: 600">Diagram Editor</span>
</div>
<sc-if value="{{standalone}}" hint-placeholder-val="{{true}}"><a class="tb" href="index.html">← Viewer</a></sc-if>
<button type="button" class="tb" onClick="{{newDoc}}">New</button>
<label class="tb" style="position: relative; overflow: hidden">Import .zip / .yaml<input type="file" multiple="{{true}}" onChange="{{onFile}}" aria-label="Import .zip or .yaml files" style="position: absolute; inset: 0; opacity: 0; cursor: pointer"></label>
<sc-if value="{{standalone}}" hint-placeholder-val="{{true}}"><button type="button" class="tb" onClick="{{loadSample}}">Load sample</button></sc-if>
<button type="button" class="tb pri" onClick="{{exportZip}}">Export .zip</button>
<button type="button" class="tb" onClick="{{exportYaml}}">Export .yaml</button>
<span aria-hidden="true" style="width: 1px; height: 28px; background: #2C3A48"></span>
<button type="button" class="tb" disabled="{{noUndo}}" onClick="{{undo}}">Undo</button>
<button type="button" class="tb" disabled="{{noRedo}}" onClick="{{redo}}">Redo</button>
<button type="button" class="tb" onClick="{{autoAll}}" title="Rearrange every asset">Auto-layout</button>
<span aria-hidden="true" style="width: 1px; height: 28px; background: #2C3A48"></span>
<button type="button" class="tb" style="min-width: 36px; padding: 0" onClick="{{zoomOut}}" aria-label="Zoom out">−</button>
<button type="button" class="tb mono" style="min-width: 56px; justify-content: center" onClick="{{zoomReset}}" aria-label="Reset zoom">{{zoomText}}</button>
<button type="button" class="tb" style="min-width: 36px; padding: 0" onClick="{{zoomIn}}" aria-label="Zoom in">+</button>
<button type="button" class="tb" onClick="{{fit}}">Fit</button>
<button type="button" class="tb" aria-pressed="{{showCols}}" onClick="{{toggleCols}}">{{colsLabel}}</button>
<button type="button" class="tb" aria-pressed="{{snap}}" onClick="{{toggleSnap}}">{{snapLabel}}</button>
</header>

<sc-if value="{{hasMsg}}" hint-placeholder-val="{{false}}">
<div role="status" style="flex: none; padding: 8px 16px; font-size: 13px; background: {{msgBg}}; color: {{msgFg}}; border-bottom: 1px solid {{msgBd}}; display: flex; justify-content: space-between; gap: 12px"><span>{{msg}}</span><button type="button" onClick="{{clearMsg}}" aria-label="Dismiss" style="border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 16px">×</button></div>
</sc-if>

<div style="flex: 1; min-height: 0; display: flex">

<aside aria-label="Palette and outline" style="flex: none; width: 236px; box-sizing: border-box; overflow: auto; background: #FFFFFF; border-right: 1px solid #DCE3EA; padding: 12px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="sec">Add asset</span>
<span style="font-size: 12px; color: #5B6876; line-height: 1.4">Click a type. If a container is selected, the new asset goes inside it.</span>
<input class="inp" type="search" placeholder="Filter types…" value="{{tq}}" onChange="{{onTq}}" aria-label="Filter asset types">
<sc-for list="{{palette}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; color: #5B6876; margin-top: 4px">{{g.cat}}</span>
<sc-for list="{{g.items}}" as="t" hint-placeholder-count="3"><button type="button" class="pal" onClick="{{t.add}}"><span aria-hidden="true" style="flex: none; width: 9px; height: 9px; border-radius: {{t.radius}}; background: {{t.color}}"></span><span>{{t.label}}</span></button></sc-for>
</div>
</sc-for>
</div>
<label class="lbl">New relations use type
<input class="inp mono" list="rel-types" value="{{relType}}" onChange="{{onRelType}}">
</label>
<datalist id="rel-types"><sc-for list="{{relTypes}}" as="r" hint-placeholder-count="3"><option value="{{r.v}}"></option></sc-for></datalist>
<div style="display: flex; flex-direction: column; gap: 4px">
<span class="sec">Outline · {{assetCount}}</span>
<input class="inp" type="search" placeholder="Find asset…" value="{{oq}}" onChange="{{onOq}}" aria-label="Find asset">
<sc-for list="{{outline}}" as="o" hint-placeholder-count="6"><button type="button" class="pal mono" onClick="{{o.pick}}" title="{{o.id}}" style="padding-left: {{o.indent}}px; font-size: 12px; background: {{o.bg}}; min-height: 28px"><span aria-hidden="true" style="flex: none; width: 7px; height: 7px; border-radius: 50%; background: {{o.color}}"></span><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{o.label}}</span></button></sc-for>
</div>
</aside>

<main style="flex: 1; min-width: 0; position: relative">
<div ref="{{canvasRef}}" tabindex="0" aria-label="Diagram canvas" style="outline: none; position: absolute; inset: 0; overflow: auto; background-color: #FBFCFD; background-image: radial-gradient(#D5DCE3 1px, transparent 1px); background-size: {{gridPx}}px {{gridPx}}px; cursor: grab">
<div style="position: relative; width: {{cw}}px; height: {{chh}}px">
<div class="{{dragCls}}" style="position: absolute; left: 0; top: 0; width: {{baseW}}px; height: {{baseH}}px; transform: scale({{zoom}}); transform-origin: 0 0">

<sc-for list="{{boxes}}" as="b" hint-placeholder-count="2">
<div data-node="{{b.id}}" class="nd {{b.cls}}" style="position: absolute; left: {{b.x}}px; top: {{b.y}}px; width: {{b.w}}px; height: {{b.h}}px; box-sizing: border-box; border: {{b.bw}}px solid {{b.bd}}; border-radius: 12px; background: {{b.bg}}">
<button type="button" data-drag="{{b.id}}" onClick="{{b.pick}}" title="Drag to move (with everything inside) · click to edit" style="display: flex; align-items: center; gap: 8px; width: 100%; height: 40px; padding: 0 12px; border: 0; background: transparent; font: inherit; color: #15202B; cursor: move; text-align: left">
<span aria-hidden="true" style="flex: none; width: 10px; height: 10px; border-radius: 3px; background: {{b.dot}}"></span>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 13px; font-weight: 600; white-space: nowrap">{{b.title}}</span><span class="mono" style="font-size: 10px; color: #5B6876; white-space: nowrap">{{b.sub}}</span></span>
</button>
<sc-for list="{{b.ports}}" as="pt" hint-placeholder-count="8"><span class="pt" data-port="{{b.id}}" data-side="{{pt.side}}" title="{{pt.title}}" style="left: {{pt.x}}px; top: {{pt.y}}px"></span></sc-for>
<span data-resize="{{b.id}}" title="Drag to resize" style="position: absolute; right: 3px; bottom: 3px; width: 14px; height: 14px; box-sizing: border-box; border-right: 3px solid #8996A3; border-bottom: 3px solid #8996A3; border-radius: 0 0 8px 0; cursor: nwse-resize"></span>
</div>
</sc-for>

<sc-for list="{{paths}}" as="p" hint-placeholder-count="3">
<svg aria-hidden="true" width="1" height="1" style="position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none"><path d="{{p.d}}" style="fill: none; stroke: {{p.color}}; stroke-width: {{p.w}}px; stroke-dasharray: {{p.dash}}"></path><path d="{{p.head}}" style="fill: {{p.color}}; stroke: none"></path><path d="{{p.d}}" onClick="{{p.pick}}" style="fill: none; stroke: transparent; stroke-width: 14px; pointer-events: stroke; cursor: pointer"></path></svg>
</sc-for>

<sc-for list="{{nodes}}" as="n" hint-placeholder-count="3">
<div data-node="{{n.id}}" class="nd {{n.cls}}" style="position: absolute; left: {{n.x}}px; top: {{n.y}}px; width: {{n.w}}px; height: {{n.h}}px; box-sizing: border-box; border-radius: 10px; background: #FFFFFF; border: 2px solid {{n.bd}}; box-shadow: 0 1px 3px rgba(21, 32, 43, 0.10)">
<button type="button" data-drag="{{n.id}}" onClick="{{n.pick}}" title="Drag to move · drop inside a container to nest it · click to edit" style="width: 100%; height: 58px; box-sizing: border-box; padding: 8px 12px; border: 0; border-radius: 8px 8px 0 0; background: {{n.bg}}; color: {{n.fg}}; text-align: left; cursor: move; font: inherit; display: flex; flex-direction: column; gap: 2px; justify-content: center">
<span style="display: flex; gap: 6px; align-items: center; max-width: 100%"><span aria-hidden="true" style="flex: none; width: 9px; height: 9px; border-radius: 50%; background: {{n.dot}}; box-shadow: 0 0 0 2px #FFFFFF"></span><span class="mono" style="font-size: 12px; white-space: nowrap">{{n.id}}</span></span>
<span style="font-size: 11px; opacity: 0.85; white-space: nowrap">{{n.typeLabel}} · {{n.name}}</span>
</button>
<sc-for list="{{n.ports}}" as="pt" hint-placeholder-count="8"><span class="pt" data-port="{{n.id}}" data-side="{{pt.side}}" title="{{pt.title}}" style="left: {{pt.x}}px; top: {{pt.y}}px"></span></sc-for>
<sc-if value="{{n.showCols}}" hint-placeholder-val="{{true}}">
<div style="padding: 4px 0; border-top: 1px solid #E6EBF0">
<sc-for list="{{n.cols}}" as="c" hint-placeholder-count="3">
<button type="button" data-col="{{c.ref}}" onClick="{{c.pick}}" title="{{c.title}}" style="position: relative; width: 100%; height: 26px; border: 0; padding: 0 14px 0 12px; display: flex; justify-content: space-between; gap: 8px; align-items: center; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 12px; cursor: pointer; text-align: left"><span class="mono" style="white-space: nowrap">{{c.name}}</span><span class="mono" style="font-size: 10px; opacity: 0.75; white-space: nowrap">{{c.badge}}</span><span data-colport="{{c.ref}}" title="Drag to a column in another asset: that column will use this one as a source" style="position: absolute; right: -7px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: #7E22CE; border: 2px solid #FFFFFF; cursor: crosshair"></span></button>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>

<sc-if value="{{hasMarquee}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; left: {{mq.x}}px; top: {{mq.y}}px; width: {{mq.w}}px; height: {{mq.h}}px; border: 1.5px dashed #0F766E; background: rgba(15, 118, 110, 0.08); pointer-events: none"></div>
</sc-if>
<sc-if value="{{hasTemp}}" hint-placeholder-val="{{false}}">
<svg aria-hidden="true" width="1" height="1" style="position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none"><path d="{{temp.d}}" style="fill: none; stroke: {{temp.color}}; stroke-width: 2px; stroke-dasharray: 6 4"></path></svg>
</sc-if>

</div>
</div>
</div>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); max-width: 420px; padding: 24px; background: #FFFFFF; border: 1px solid #DCE3EA; border-radius: 12px; text-align: center; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 20px rgba(21, 32, 43, 0.08)">
<strong style="font-size: 16px">Start a diagram</strong>
<span style="font-size: 13px; color: #4A5765; line-height: 1.5">Import a .zip / .yaml project, load the sample, or add assets from the palette on the left. Drag the teal dot to connect assets, the purple dot to connect columns, and the corner of a container to resize it.</span>
</div>
</sc-if>
</main>

<aside aria-label="Properties" style="flex: none; width: 340px; box-sizing: border-box; overflow: auto; background: #FFFFFF; border-left: 1px solid #DCE3EA; padding: 14px; display: flex; flex-direction: column; gap: 12px">

<sc-if value="{{selNone}}" hint-placeholder-val="{{true}}">
<span class="sec">Properties</span>
<p style="margin: 0; font-size: 13px; color: #4A5765; line-height: 1.55">Select an asset, a column, or a line to edit it.</p>
<ul style="margin: 0; padding-left: 18px; font-size: 12px; color: #4A5765; line-height: 1.7">
<li>Drag an asset's header to move it; drop it inside a container to nest it.</li>
<li>Drag a container's header to move it with everything inside; drag its corner to resize.</li>
<li>Hover a block to see its 8 <span style="color: #0F766E; font-weight: 600">teal dots</span> (left, right, 3 on top, 3 at the bottom). Drag one onto another asset to add a lineage relation; the arrow lands on the nearest dot there.</li>
<li>Drag a column's <span style="color: #7E22CE; font-weight: 600">purple dot</span> onto a column of another asset to make it a source.</li>
<li>Shift/Ctrl/⌘ + click to select several assets, or Shift + drag on empty space to box-select. Drag one of them to move them all.</li>
<li>Keyboard (click the canvas first): Ctrl/⌘+D duplicate · Delete remove · Ctrl/⌘+A select all · Ctrl/⌘+Z undo · Esc clear.</li>
<li>Ctrl/⌘ + scroll to zoom; drag the background to pan.</li>
</ul>
<span style="font-size: 12px; color: #5B6876">{{stats}}</span>
</sc-if>

<sc-if value="{{selAsset}}" hint-placeholder-val="{{false}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span class="sec">{{pa.typeLabel}}</span><span style="display: flex; gap: 6px"><button type="button" class="tb" style="min-height: 32px" onClick="{{dupOne}}" title="Ctrl/⌘ + D">Duplicate</button><button type="button" class="del" onClick="{{pa.del}}">Delete</button></span></div>
<div style="display: flex; gap: 6px; align-items: flex-end">
<label class="lbl" style="flex: 1">ID<input class="inp mono" value="{{idBuf}}" onChange="{{onIdBuf}}"></label>
<button type="button" class="tb" disabled="{{pa.idSame}}" onClick="{{pa.rename}}">Rename</button>
</div>
<label class="lbl">Type
<select class="inp" value="{{pa.type}}" onChange="{{pa.onType}}"><sc-for list="{{typeOpts}}" as="o" hint-placeholder-count="4"><option value="{{o.id}}">{{o.label}}</option></sc-for></select>
</label>
<label class="lbl">Name<input class="inp" value="{{pa.name}}" onChange="{{pa.onName}}"></label>
<label class="lbl">Parent (container)
<select class="inp mono" value="{{pa.parent}}" onChange="{{pa.onParent}}"><option value="">— none —</option><sc-for list="{{pa.parentOpts}}" as="o" hint-placeholder-count="4"><option value="{{o.id}}">{{o.id}}</option></sc-for></select>
</label>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<label class="lbl">Owner<input class="inp" value="{{pa.owner}}" onChange="{{pa.onOwner}}"></label>
<label class="lbl">Domain<input class="inp" value="{{pa.domain}}" onChange="{{pa.onDomain}}"></label>
</div>
<label class="lbl">Source / location<input class="inp mono" value="{{pa.source}}" onChange="{{pa.onSource}}"></label>
<label class="lbl">Tags (comma separated)<input class="inp" value="{{tagsBuf}}" onChange="{{onTagsBuf}}" onBlur="{{pa.commitTags}}"></label>
<label class="lbl">Description<textarea class="inp" rows="2" style="font-family: inherit; font-size: 13px" value="{{pa.description}}" onChange="{{pa.onDescription}}"></textarea></label>
<label class="lbl">Properties (YAML)<textarea class="inp" rows="4" value="{{propBuf}}" onChange="{{onPropBuf}}"></textarea></label>
<div><button type="button" class="tb" onClick="{{pa.applyProps}}">Apply properties</button></div>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px"><span class="sec">Columns · {{pa.colCount}}</span><button type="button" class="tb" onClick="{{pa.addCol}}">+ Column</button></div>
<sc-for list="{{pa.cols}}" as="f" hint-placeholder-count="2">
<div style="border: 1px solid {{f.bd}}; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: {{f.bg}}">
<div style="display: grid; grid-template-columns: 1fr 110px; gap: 6px">
<input class="inp mono" aria-label="Column name" value="{{f.name}}" onChange="{{f.onName}}">
<input class="inp mono" aria-label="Column type" list="col-types" value="{{f.type}}" onChange="{{f.onType}}">
</div>
<input class="inp" aria-label="Description" placeholder="Description" value="{{f.description}}" onChange="{{f.onDesc}}">
<input class="inp mono" aria-label="Expression" placeholder="Expression, e.g. SUM(net_amount)" value="{{f.expression}}" onChange="{{f.onExpr}}">
<div style="display: flex; flex-wrap: wrap; gap: 4px; align-items: center"><span style="font-size: 11px; color: #5B6876">Sources:</span><sc-for list="{{f.sources}}" as="sr" hint-placeholder-count="1"><span class="chip mono"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px">{{sr.ref}}</span><button type="button" onClick="{{sr.remove}}" aria-label="Remove source {{sr.ref}}">×</button></span></sc-for><sc-if value="{{f.noSources}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; color: #5B6876; font-style: italic">none (source column)</span></sc-if></div>
<div style="display: flex; gap: 6px"><input class="inp mono" list="all-cols" placeholder="add source: asset.column" aria-label="Add source column" value="{{f.srcBuf}}" onChange="{{f.onSrcBuf}}"><button type="button" class="tb" onClick="{{f.addSrc}}">Add</button></div>
<div style="display: flex; gap: 12px; align-items: center; font-size: 12px">
<label style="display: flex; gap: 6px; align-items: center"><input type="checkbox" checked="{{f.nullable}}" onChange="{{f.onNull}}"> Nullable</label>
<label style="display: flex; gap: 6px; align-items: center"><input type="checkbox" checked="{{f.pii}}" onChange="{{f.onPii}}"> PII</label>
<span style="flex: 1"></span>
<button type="button" class="del" onClick="{{f.del}}">Delete</button>
</div>
</div>
</sc-for>
<datalist id="col-types"><sc-for list="{{colTypes}}" as="ty" hint-placeholder-count="4"><option value="{{ty.v}}"></option></sc-for></datalist>
<datalist id="all-cols"><sc-for list="{{allCols}}" as="ac" hint-placeholder-count="4"><option value="{{ac.v}}"></option></sc-for></datalist>

<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
<span class="sec">Relations · {{pa.relCount}}</span>
<sc-for list="{{pa.rels}}" as="r" hint-placeholder-count="2"><div style="display: flex; gap: 6px; align-items: center; font-size: 12px"><button type="button" class="pal mono" style="flex: 1; min-width: 0; font-size: 11px" onClick="{{r.pick}}"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.label}}</span></button><button type="button" class="del" onClick="{{r.del}}" aria-label="Delete relation">×</button></div></sc-for>
</div>
</sc-if>

<sc-if value="{{selMulti}}" hint-placeholder-val="{{false}}">
<span class="sec">{{pm.count}} assets selected</span>
<span style="font-size: 12px; color: #4A5765; line-height: 1.5">Drag any of them to move them together{{pm.extra}}. Shift/Ctrl/⌘ + click adds or removes an asset.</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<button type="button" class="tb pri" onClick="{{pm.duplicate}}" title="Ctrl/⌘ + D">Duplicate</button>
<button type="button" class="del" style="min-height: 36px" onClick="{{pm.del}}" title="Delete">Delete</button>
<button type="button" class="tb" onClick="{{pm.clear}}" title="Esc">Clear selection</button>
</div>
<label class="lbl">Move all into container
<select class="inp mono" value="{{pm.parent}}" onChange="{{pm.onParent}}"><option value="">— none (top level) —</option><sc-for list="{{pm.parentOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.id}}">{{o.id}}</option></sc-for></select>
</label>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{pm.items}}" as="it" hint-placeholder-count="3"><div style="display: flex; gap: 4px; align-items: center"><button type="button" class="pal mono" style="flex: 1; min-width: 0; font-size: 11px; min-height: 30px" onClick="{{it.pick}}" title="{{it.sub}}"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{it.label}}</span></button><button type="button" class="del" style="min-height: 28px" onClick="{{it.remove}}" aria-label="Unselect {{it.id}}">×</button></div></sc-for>
</div>
</sc-if>

<sc-if value="{{selEdge}}" hint-placeholder-val="{{false}}">
<div style="display: flex; justify-content: space-between; align-items: center"><span class="sec">Lineage relation</span><button type="button" class="del" onClick="{{pe.del}}">Delete</button></div>
<div class="mono" style="font-size: 12px; line-height: 1.6; word-break: break-all"><button type="button" class="pal mono" style="font-size: 12px" onClick="{{pe.pickFrom}}">{{pe.from}}</button><span style="color: #5B6876; padding-left: 10px">↓</span><button type="button" class="pal mono" style="font-size: 12px" onClick="{{pe.pickTo}}">{{pe.to}}</button></div>
<label class="lbl">Relation type<input class="inp mono" list="rel-types" value="{{pe.type}}" onChange="{{pe.onType}}"></label>
<label class="lbl">Process / transformation<input class="inp" value="{{pe.process}}" onChange="{{pe.onProcess}}"></label>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<label class="lbl">Leaves from
<select class="inp" value="{{pe.fromSide}}" onChange="{{pe.onFromSide}}"><option value="">Auto</option><sc-for list="{{sides}}" as="sd" hint-placeholder-count="8"><option value="{{sd.id}}">{{sd.label}}</option></sc-for></select>
</label>
<label class="lbl">Arrives at
<select class="inp" value="{{pe.toSide}}" onChange="{{pe.onToSide}}"><option value="">Auto</option><sc-for list="{{sides}}" as="sd" hint-placeholder-count="8"><option value="{{sd.id}}">{{sd.label}}</option></sc-for></select>
</label>
</div>
<span style="font-size: 11px; color: #5B6876">Tip: drag from any of the 8 dots on a block; the arrow lands on the dot nearest to where you drop it.</span>
<div><button type="button" class="tb" onClick="{{pe.reverse}}">Reverse direction</button></div>
</sc-if>

<sc-if value="{{selColSrc}}" hint-placeholder-val="{{false}}">
<span class="sec">Column source</span>
<div class="mono" style="font-size: 12px; line-height: 1.6; word-break: break-all"><button type="button" class="pal mono" style="font-size: 12px" onClick="{{pcs.pickSource}}">{{pcs.source}}</button><span style="color: #5B6876; padding-left: 10px">feeds ↓</span><button type="button" class="pal mono" style="font-size: 12px" onClick="{{pcs.pickTarget}}">{{pcs.target}}</button></div>
<div><button type="button" class="del" onClick="{{pcs.remove}}">Remove this source</button></div>
</sc-if>
</aside>
</div>
</div>
