# Asset-level lineage. Column-level lineage lives in each field (expression + sources).
lineage:
  - from: external.erp
    to: gcs.acme-sales-landing/orders
    type: writes
    process: Daily file export
  - from: gcs.acme-sales-landing/orders
    to: acme-sales.raw.orders
    type: writes
    process: BigQuery load job
  - from: airflow.variable.sales_gcp_project
    to: airflow.sales_daily
    type: configures
  - from: airflow.connection.bq_sales
    to: airflow.sales_daily.tg_transform.load_staging
    type: uses
  - from: acme-sales.raw.orders
    to: airflow.sales_daily.tg_transform.load_staging
    type: reads
  - from: airflow.sales_daily.tg_transform.load_staging
    to: acme-sales.staging.orders_clean
    type: writes
    process: Daily MERGE
  - from: acme-sales.raw.orders
    to: airflow.sales_daily.tg_transform.load_staging.dq_merge_orders
    type: reads
  - from: airflow.sales_daily.tg_transform.load_staging.dq_merge_orders
    to: acme-sales.staging.orders_clean
    type: writes
    process: MERGE
  - from: acme-sales.staging.fn_clean_amount
    to: acme-sales.staging.orders_clean
    type: used_by
  - from: airflow.sales_daily.tg_transform.call_sp
    to: acme-sales.mart.sp_build_sales_daily
    type: calls
  - from: acme-sales.staging.orders_clean
    to: acme-sales.mart.sp_build_sales_daily
    type: reads
  - from: sheet.sales_targets
    to: acme-sales.mart.sp_build_sales_daily
    type: reads
  - from: acme-sales.mart.sp_build_sales_daily
    to: acme-sales.mart.sales_daily
    type: writes
  - from: acme-sales.mart.sales_daily
    to: acme-sales.mart.v_sales_features
    type: reads
  - from: acme-sales.mart.sales_daily
    to: acme-sales.mart.mv_sales_monthly
    type: reads
  - from: acme-sales.mart.v_sales_features
    to: vertex.feature_view.sales_features
    type: syncs
  - from: vertex.feature_view.sales_features
    to: vertex.pipeline.sales_forecast
    type: reads
  - from: artifact_registry.ml-sales.sales-trainer
    to: vertex.pipeline.sales_forecast.train
    type: uses
  - from: vertex.pipeline.sales_forecast.train
    to: vertex.pipeline.sales_forecast
    type: part_of
  - from: airflow.sales_daily.trigger_training
    to: vertex.pipeline.sales_forecast
    type: triggers
  - from: vertex.pipeline.sales_forecast
    to: vertex.model.sales_forecast
    type: produces
  - from: vertex.model.sales_forecast
    to: vertex.endpoint.sales_forecast
    type: deploys
