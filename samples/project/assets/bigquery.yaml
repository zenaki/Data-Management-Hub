  - id: acme-marketing.mart.marketing_daily
    type: bigquery.table
    name: Marketing daily
    parent: acme-marketing.mart
    domain: Marketing
    owner: bi-team
    description: Marketing aggregated per day, built by a stored procedure.
    tags: [mart, dashboard]
    fields:
      - name: event_date
        type: DATE
        nullable: false
        pii: false
        description: Date.
        expression: GROUP BY event_date
        sources: [acme-marketing.staging.clicks_clean.event_date]
      - name: total_marketing
        type: NUMERIC
        nullable: false
        pii: false
        description: Total net value per day.
        expression: SUM(net_value)
        sources: [acme-marketing.staging.clicks_clean.net_value]
      - name: active_campaigns
        type: INT64
        nullable: false
        pii: false
        description: Distinct campaigns per day.
        expression: COUNT(DISTINCT campaign_id)
