      - name: finance_7d_avg
        type: FLOAT64
        nullable: true
        pii: false
        description: 7-day moving average.
        expression: AVG(total_finance) OVER (ORDER BY event_date ROWS 6 PRECEDING)
        sources: [acme-finance.mart.finance_daily.total_finance]
