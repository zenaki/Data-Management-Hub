    domain: Support
    owner: cx-data
    source: Helpdesk via GCS
    description: As-is ticket records loaded from the landing bucket.
    tags: [raw]
    properties:
      partition_by: DATE(opened_ts)
    fields:
      - name: ticket_id
        type: INT64
        nullable: false
        pii: false
        description: Unique ticket ID.
      - name: customer_id
        type: INT64
        nullable: false
        pii: true
        description: Reference to the customer.
      - name: opened_ts
        type: TIMESTAMP
        nullable: false
        pii: false
        description: Event time (UTC).
      - name: handle_minutes
        type: INT64
        nullable: true
        pii: false
        description: Raw handle minutes.
      - name: wait_minutes
        type: INT64
        nullable: true
        pii: false
        description: Adjustment (wait minutes).
  - id: acme-support.staging.fn_clean_handle_minutes
    type: bigquery.udf
    name: fn_clean_handle_minutes
    parent: acme-support.staging
    domain: Support
    owner: analytics-eng
    properties:
      language: SQL
      returns: INT64
      body: GREATEST(IFNULL(x, 0), 0)
  - id: acme-support.staging.tickets_clean
    type: bigquery.table
    name: Support tickets (clean)
    parent: acme-support.staging
    domain: Support
    owner: analytics-eng
    description: Deduplicated, normalised tickets.
    tags: [staging]
    fields:
      - name: ticket_id
        type: INT64
        nullable: false
        pii: false
        description: Unique ticket ID.
        expression: QUALIFY ROW_NUMBER() OVER (PARTITION BY ticket_id ORDER BY opened_ts DESC) = 1
        sources: [acme-support.raw.tickets.ticket_id]
      - name: customer_id
        type: INT64
        nullable: false
        pii: true
        description: Reference to the customer.
        sources: [acme-support.raw.tickets.customer_id]
      - name: event_date
        type: DATE
        nullable: false
        pii: false
        description: Event date (Asia/Jakarta).
        expression: DATE(opened_ts, 'Asia/Jakarta')
        sources: [acme-support.raw.tickets.opened_ts]
      - name: net_value
        type: INT64
        nullable: false
        pii: false
        description: Value after adjustment.
        expression: fn_clean_handle_minutes(handle_minutes) - IFNULL(wait_minutes, 0)
        sources: [acme-support.raw.tickets.handle_minutes, acme-support.raw.tickets.wait_minutes]
  - id: acme-support.mart.sp_build_support_daily
    type: bigquery.stored_procedure
    name: sp_build_support_daily
    parent: acme-support.mart
    domain: Support
    owner: analytics-eng
    properties:
      language: SQL
      args: [run_date DATE]
  - id: acme-support.mart.support_daily
    type: bigquery.table
    name: Support daily
    parent: acme-support.mart
    domain: Support
    owner: bi-team
    description: Support aggregated per day, built by a stored procedure.
    tags: [mart, dashboard]
    fields:
      - name: event_date
        type: DATE
        nullable: false
        pii: false
        description: Date.
        expression: GROUP BY event_date
        sources: [acme-support.staging.tickets_clean.event_date]
      - name: total_support
        type: INT64
        nullable: false
        pii: false
        description: Total net value per day.
        expression: SUM(net_value)
        sources: [acme-support.staging.tickets_clean.net_value]
      - name: active_customers
        type: INT64
        nullable: false
        pii: false
        description: Distinct customers per day.
        expression: COUNT(DISTINCT customer_id)
        sources: [acme-support.staging.tickets_clean.customer_id]
      - name: avg_per_ticket
        type: FLOAT64
        nullable: true
        pii: false
        description: Average value per ticket.
        expression: SAFE_DIVIDE(SUM(net_value), COUNT(ticket_id))
        sources: [acme-support.staging.tickets_clean.net_value, acme-support.staging.tickets_clean.ticket_id]
      - name: target_attainment
        type: FLOAT64
        nullable: true
        pii: false
        description: Month-to-date share of the monthly target.
        expression: SAFE_DIVIDE(SUM(SUM(net_value)) OVER (PARTITION BY DATE_TRUNC(event_date, MONTH) ORDER BY event_date), t.target_value)
        sources: [acme-support.staging.tickets_clean.net_value, sheet.support_targets.target_value]
  - id: acme-support.mart.v_support_features
    type: bigquery.view
    name: Support features
    parent: acme-support.mart
    domain: Support
    owner: ml-team
    fields:
      - name: event_date
        type: DATE
        nullable: false
        pii: false
        description: Date.
        sources: [acme-support.mart.support_daily.event_date]
      - name: support_7d_avg
        type: FLOAT64
        nullable: true
        pii: false
        description: 7-day moving average.
        expression: AVG(total_support) OVER (ORDER BY event_date ROWS 6 PRECEDING)
        sources: [acme-support.mart.support_daily.total_support]
  - id: acme-support.mart.mv_support_monthly
    type: bigquery.materialized_view
    name: Support monthly
    parent: acme-support.mart
    domain: Support
    owner: bi-team
    properties:
      refresh_interval_minutes: 60
    fields:
      - name: month
        type: DATE
        nullable: false
        pii: false
        description: Month.
        expression: DATE_TRUNC(event_date, MONTH)
        sources: [acme-support.mart.support_daily.event_date]
      - name: monthly_total
        type: INT64
        nullable: false
        pii: false
        description: Monthly total.
        expression: SUM(total_support)
        sources: [acme-support.mart.support_daily.total_support]
  - id: airflow.variable.support_gcp_project
    type: airflow.variable
    name: support_gcp_project
    domain: Support
    owner: platform
    properties:
      key: support_gcp_project
      value: acme-support
  - id: airflow.connection.bq_support
    type: airflow.connection
    name: bq_support
    domain: Support
    owner: platform
    properties:
      conn_type: google_cloud_platform
      project: acme-support
  - id: airflow.support_daily
    type: airflow.dag
    name: support_daily
    domain: Support
    owner: cx-data
    description: Daily support pipeline, from landing files to model training.
    tags: [daily]
    properties:
      schedule: 0 1 * * *
      catchup: false
      max_active_runs: 1
  - id: airflow.support_daily.tg_transform
    type: airflow.task_group
    name: tg_transform
    parent: airflow.support_daily
    domain: Support
  - id: airflow.support_daily.tg_transform.load_staging
    type: airflow.task
    name: load_staging
    parent: airflow.support_daily.tg_transform
    domain: Support
    properties:
      operator: BigQueryInsertJobOperator
      retries: 2
  - id: airflow.support_daily.tg_transform.call_sp
    type: airflow.task
    name: call_sp
    parent: airflow.support_daily.tg_transform
    domain: Support
    properties:
      operator: BigQueryInsertJobOperator
      sql: CALL mart.sp_build_support_daily(@run_date)
  - id: airflow.support_daily.trigger_training
    type: airflow.task
    name: trigger_training
    parent: airflow.support_daily
    domain: Support
    properties:
      operator: RunPipelineJobOperator
  - id: artifact_registry.ml-support
    type: artifact_registry.repository
    name: ml-support
    domain: Support
    owner: ml-team
    properties:
      format: DOCKER
      location: asia-southeast2
  - id: artifact_registry.ml-support.support-trainer
    type: artifact_registry.image
    name: support-trainer
    parent: artifact_registry.ml-support
    domain: Support
    owner: ml-team
    properties:
      uri: asia-southeast2-docker.pkg.dev/acme-support/ml-support/support-trainer
      tag: v1.0.0
  - id: vertex.feature_view.support_features
    type: vertex.feature_view
    name: support_features
    domain: Support
    owner: ml-team
    properties:
      online_store: acme_online
      sync: daily
  - id: vertex.pipeline.ticket_volume_forecast.train
    type: vertex.pipeline_component
    name: train
    parent: vertex.pipeline.ticket_volume_forecast
    domain: Support
    owner: ml-team
    properties:
      image: artifact_registry.ml-support.support-trainer
  - id: vertex.pipeline.ticket_volume_forecast
    type: vertex.pipeline
    name: ticket_volume_forecast
    domain: Support
    owner: ml-team
    properties:
      template: gs://acme-support-pipelines/ticket_volume_forecast.json
  - id: vertex.model.ticket_volume_forecast
    type: vertex.model
    name: ticket_volume_forecast
    domain: Support
    owner: ml-team
    properties:
      version: 1
      framework: xgboost
  - id: vertex.endpoint.ticket_volume_forecast
    type: vertex.endpoint
    name: ticket_volume_forecast-endpoint
    domain: Support
    owner: ml-team
    properties:
      machine_type: n1-standard-2
      min_replicas: 1
