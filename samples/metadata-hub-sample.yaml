assets:
  - id: external.erp
    type: external
    name: ERP system
    domain: Sales
    owner: sales-data
    description: Operational source system for sales data.
    properties:
      vendor: ERP
      extract: daily file export
  - id: sheet.sales_targets
    type: dataset
    name: Sales targets sheet
    domain: Sales
    owner: sales-data
    source: Google Sheets
    description: Monthly targets maintained by the business.
    fields:
      - name: month
        type: DATE
        nullable: false
        pii: false
        description: Target month.
      - name: target_value
        type: NUMERIC
        nullable: false
        pii: false
        description: Monthly target.
  - id: gcs.acme-sales-landing
    type: gcs.bucket
    name: Landing bucket sales
    domain: Sales
    owner: platform
    properties:
      location: asia-southeast2
      storage_class: STANDARD
  - id: gcs.acme-sales-landing/orders
    type: gcs.object
    name: orders landing files
    parent: gcs.acme-sales-landing
    domain: Sales
    properties:
      pattern: orders/dt={{ ds }}/*.parquet
      format: parquet
  - id: acme-sales
    type: bigquery.project
    name: GCP project sales
    domain: Sales
    owner: platform
    properties:
      region: asia-southeast2
      billing_account: acme-billing
  - id: acme-sales.raw
    type: bigquery.dataset
    name: raw
    parent: acme-sales
    domain: Sales
    properties:
      location: asia-southeast2
      default_table_expiration_days: 400
  - id: acme-sales.staging
    type: bigquery.dataset
    name: staging
    parent: acme-sales
    domain: Sales
    properties:
      location: asia-southeast2
  - id: acme-sales.mart
    type: bigquery.dataset
    name: mart
    parent: acme-sales
    domain: Sales
    properties:
      location: asia-southeast2
  - id: acme-sales.raw.orders
    type: bigquery.table
    name: Sales orders (raw)
    parent: acme-sales.raw
    domain: Sales
    owner: sales-data
    source: ERP via GCS
    description: As-is order records loaded from the landing bucket.
    tags: [raw]
    properties:
      partition_by: DATE(order_ts)
    fields:
      - name: order_id
        type: INT64
        nullable: false
        pii: false
        description: Unique order ID.
      - name: customer_id
        type: INT64
        nullable: false
        pii: true
        description: Reference to the customer.
      - name: order_ts
        type: TIMESTAMP
        nullable: false
        pii: false
        description: Event time (UTC).
      - name: amount
        type: NUMERIC
        nullable: true
        pii: false
        description: Raw amount.
      - name: discount
        type: NUMERIC
        nullable: true
        pii: false
        description: Adjustment (discount).
  - id: acme-sales.staging.fn_clean_amount
    type: bigquery.udf
    name: fn_clean_amount
    parent: acme-sales.staging
    domain: Sales
    owner: analytics-eng
    properties:
      language: SQL
      returns: NUMERIC
      body: GREATEST(IFNULL(x, 0), 0)
  - id: acme-sales.staging.orders_clean
    type: bigquery.table
    name: Sales orders (clean)
    parent: acme-sales.staging
    domain: Sales
    owner: analytics-eng
    description: Deduplicated, normalised orders.
    tags: [staging]
    fields:
      - name: order_id
        type: INT64
        nullable: false
        pii: false
        description: Unique order ID.
        expression: QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY order_ts DESC) = 1
        sources: [acme-sales.raw.orders.order_id]
      - name: customer_id
        type: INT64
        nullable: false
        pii: true
        description: Reference to the customer.
        sources: [acme-sales.raw.orders.customer_id]
      - name: event_date
        type: DATE
        nullable: false
        pii: false
        description: Event date (Asia/Jakarta).
        expression: DATE(order_ts, 'Asia/Jakarta')
        sources: [acme-sales.raw.orders.order_ts]
      - name: net_value
        type: NUMERIC
        nullable: false
        pii: false
        description: Value after adjustment.
        expression: fn_clean_amount(amount) - IFNULL(discount, 0)
        sources: [acme-sales.raw.orders.amount, acme-sales.raw.orders.discount]
  - id: acme-sales.mart.sp_build_sales_daily
    type: bigquery.stored_procedure
    name: sp_build_sales_daily
    parent: acme-sales.mart
    domain: Sales
    owner: analytics-eng
    properties:
      language: SQL
      args: [run_date DATE]
  - id: acme-sales.mart.sales_daily
    type: bigquery.table
    name: Sales daily
    parent: acme-sales.mart
    domain: Sales
    owner: bi-team
    description: Sales aggregated per day, built by a stored procedure.
    tags: [mart, dashboard]
    fields:
      - name: event_date
        type: DATE
        nullable: false
        pii: false
        description: Date.
        expression: GROUP BY event_date
        sources: [acme-sales.staging.orders_clean.event_date]
      - name: total_sales
        type: NUMERIC
        nullable: false
        pii: false
        description: Total net value per day.
        expression: SUM(net_value)
        sources: [acme-sales.staging.orders_clean.net_value]
      - name: active_customers
        type: INT64
        nullable: false
        pii: false
        description: Distinct customers per day.
        expression: COUNT(DISTINCT customer_id)
        sources: [acme-sales.staging.orders_clean.customer_id]
      - name: avg_per_order
        type: FLOAT64
        nullable: true
        pii: false
        description: Average value per order.
        expression: SAFE_DIVIDE(SUM(net_value), COUNT(order_id))
        sources: [acme-sales.staging.orders_clean.net_value, acme-sales.staging.orders_clean.order_id]
      - name: target_attainment
        type: FLOAT64
        nullable: true
        pii: false
        description: Month-to-date share of the monthly target.
        expression: SAFE_DIVIDE(SUM(SUM(net_value)) OVER (PARTITION BY DATE_TRUNC(event_date, MONTH) ORDER BY event_date), t.target_value)
        sources: [acme-sales.staging.orders_clean.net_value, sheet.sales_targets.target_value]
  - id: acme-sales.mart.v_sales_features
    type: bigquery.view
    name: Sales features
    parent: acme-sales.mart
    domain: Sales
    owner: ml-team
    fields:
      - name: event_date
        type: DATE
        nullable: false
        pii: false
        description: Date.
        sources: [acme-sales.mart.sales_daily.event_date]
      - name: sales_7d_avg
        type: FLOAT64
        nullable: true
        pii: false
        description: 7-day moving average.
        expression: AVG(total_sales) OVER (ORDER BY event_date ROWS 6 PRECEDING)
        sources: [acme-sales.mart.sales_daily.total_sales]
  - id: acme-sales.mart.mv_sales_monthly
    type: bigquery.materialized_view
    name: Sales monthly
    parent: acme-sales.mart
    domain: Sales
    owner: bi-team
    properties:
      refresh_interval_minutes: 60
    fields:
      - name: month
        type: DATE
        nullable: false
        pii: false
        description: Month.
        expression: DATE_TRUNC(event_date, MONTH)
        sources: [acme-sales.mart.sales_daily.event_date]
      - name: monthly_total
        type: NUMERIC
        nullable: false
        pii: false
        description: Monthly total.
        expression: SUM(total_sales)
        sources: [acme-sales.mart.sales_daily.total_sales]
  - id: airflow.variable.sales_gcp_project
    type: airflow.variable
    name: sales_gcp_project
    domain: Sales
    owner: platform
    properties:
      key: sales_gcp_project
      value: acme-sales
  - id: airflow.connection.bq_sales
    type: airflow.connection
    name: bq_sales
    domain: Sales
    owner: platform
    properties:
      conn_type: google_cloud_platform
      project: acme-sales
  - id: airflow.sales_daily
    type: airflow.dag
    name: sales_daily
    domain: Sales
    owner: sales-data
    description: Daily sales pipeline, from landing files to model training.
    tags: [daily]
    properties:
      schedule: 0 1 * * *
      catchup: false
      max_active_runs: 1
  - id: airflow.sales_daily.tg_transform
    type: airflow.task_group
    name: tg_transform
    parent: airflow.sales_daily
    domain: Sales
  - id: airflow.sales_daily.tg_transform.load_staging
    type: airflow.task
    name: load_staging
    parent: airflow.sales_daily.tg_transform
    domain: Sales
    properties:
      operator: BigQueryInsertJobOperator
      retries: 2
  - id: airflow.sales_daily.tg_transform.call_sp
    type: airflow.task
    name: call_sp
    parent: airflow.sales_daily.tg_transform
    domain: Sales
    properties:
      operator: BigQueryInsertJobOperator
      sql: CALL mart.sp_build_sales_daily(@run_date)
  - id: airflow.sales_daily.trigger_training
    type: airflow.task
    name: trigger_training
    parent: airflow.sales_daily
    domain: Sales
    properties:
      operator: RunPipelineJobOperator
  - id: artifact_registry.ml-sales
    type: artifact_registry.repository
    name: ml-sales
    domain: Sales
    owner: ml-team
    properties:
      format: DOCKER
      location: asia-southeast2
  - id: artifact_registry.ml-sales.sales-trainer
    type: artifact_registry.image
    name: sales-trainer
    parent: artifact_registry.ml-sales
    domain: Sales
    owner: ml-team
    properties:
      uri: asia-southeast2-docker.pkg.dev/acme-sales/ml-sales/sales-trainer
      tag: v1.0.0
  - id: vertex.feature_view.sales_features
    type: vertex.feature_view
    name: sales_features
    domain: Sales
    owner: ml-team
    properties:
      online_store: acme_online
      sync: daily
  - id: vertex.pipeline.sales_forecast.train
    type: vertex.pipeline_component
    name: train
    parent: vertex.pipeline.sales_forecast
    domain: Sales
    owner: ml-team
    properties:
      image: artifact_registry.ml-sales.sales-trainer
  - id: vertex.pipeline.sales_forecast
    type: vertex.pipeline
    name: sales_forecast
    domain: Sales
    owner: ml-team
    properties:
      template: gs://acme-sales-pipelines/sales_forecast.json
  - id: vertex.model.sales_forecast
    type: vertex.model
    name: sales_forecast
    domain: Sales
    owner: ml-team
    properties:
      version: 1
      framework: xgboost
  - id: vertex.endpoint.sales_forecast
    type: vertex.endpoint
    name: sales_forecast-endpoint
