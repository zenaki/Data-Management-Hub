    properties:
      language: SQL
      args: [run_date DATE]
  - id: acme-finance.mart.finance_daily
    type: bigquery.table
    name: Finance daily
    parent: acme-finance.mart
    domain: Finance
    owner: bi-team
    description: Finance aggregated per day, built by a stored procedure.
    tags: [mart, dashboard]
    fields:
      - name: event_date
        type: DATE
        nullable: false
        pii: false
        description: Date.
        expression: GROUP BY event_date
        sources: [acme-finance.staging.txns_clean.event_date]
      - name: total_finance
        type: NUMERIC
        nullable: false
        pii: false
        description: Total net value per day.
        expression: SUM(net_value)
        sources: [acme-finance.staging.txns_clean.net_value]
      - name: active_accounts
        type: INT64
        nullable: false
        pii: false
        description: Distinct accounts per day.
        expression: COUNT(DISTINCT account_id)
        sources: [acme-finance.staging.txns_clean.account_id]
      - name: avg_per_txn
        type: FLOAT64
        nullable: true
        pii: false
        description: Average value per txn.
        expression: SAFE_DIVIDE(SUM(net_value), COUNT(txn_id))
        sources: [acme-finance.staging.txns_clean.net_value, acme-finance.staging.txns_clean.txn_id]
      - name: target_attainment
        type: FLOAT64
        nullable: true
        pii: false
        description: Month-to-date share of the monthly target.
        expression: SAFE_DIVIDE(SUM(SUM(net_value)) OVER (PARTITION BY DATE_TRUNC(event_date, MONTH) ORDER BY event_date), t.target_value)
        sources: [acme-finance.staging.txns_clean.net_value, sheet.finance_targets.target_value]
