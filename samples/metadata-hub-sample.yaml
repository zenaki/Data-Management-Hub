    type: bigquery.table
    name: Finance txns (raw)
    parent: acme-finance.raw
    domain: Finance
    owner: finance-data
    source: Core banking via GCS
    description: As-is txn records loaded from the landing bucket.
    tags: [raw]
    properties:
      partition_by: DATE(txn_ts)
    fields:
      - name: txn_id
        type: INT64
        nullable: false
        pii: false
        description: Unique txn ID.
      - name: account_id
        type: INT64
        nullable: false
        pii: false
        description: Reference to the account.
      - name: txn_ts
        type: TIMESTAMP
        nullable: false
        pii: false
        description: Event time (UTC).
      - name: amount
        type: NUMERIC
        nullable: true
        pii: false
        description: Raw amount.
      - name: fee
        type: NUMERIC
        nullable: true
        pii: false
        description: Adjustment (fee).
