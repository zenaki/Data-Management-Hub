    type: bigquery.udf
    name: fn_clean_amount
    parent: acme-finance.staging
    domain: Finance
    owner: analytics-eng
    properties:
      language: SQL
      returns: NUMERIC
      body: GREATEST(IFNULL(x, 0), 0)
  - id: acme-finance.staging.txns_clean
    type: bigquery.table
    name: Finance txns (clean)
    parent: acme-finance.staging
    domain: Finance
    owner: analytics-eng
    description: Deduplicated, normalised txns.
    tags: [staging]
    fields:
      - name: txn_id
        type: INT64
        nullable: false
        pii: false
        description: Unique txn ID.
        expression: QUALIFY ROW_NUMBER() OVER (PARTITION BY txn_id ORDER BY txn_ts DESC) = 1
        sources: [acme-finance.raw.txns.txn_id]
      - name: account_id
        type: INT64
        nullable: false
        pii: false
        description: Reference to the account.
        sources: [acme-finance.raw.txns.account_id]
      - name: event_date
        type: DATE
        nullable: false
        pii: false
        description: Event date (Asia/Jakarta).
        expression: DATE(txn_ts, 'Asia/Jakarta')
        sources: [acme-finance.raw.txns.txn_ts]
      - name: net_value
        type: NUMERIC
        nullable: false
        pii: false
        description: Value after adjustment.
        expression: fn_clean_amount(amount) - IFNULL(fee, 0)
        sources: [acme-finance.raw.txns.amount, acme-finance.raw.txns.fee]
